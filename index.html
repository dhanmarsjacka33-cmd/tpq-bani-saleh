function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, function(c) {
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
  });
}

function showToast(msg, type) {
  type = type || 'info';
  const colors = {
    success: 'from-green-400 to-emerald-500',
    error: 'from-red-400 to-rose-500',
    info: 'from-blue-400 to-indigo-500',
    warn: 'from-amber-400 to-orange-500'
  };
  const icons = { success: '✅', error: '⚠️', info: 'ℹ️', warn: '⚡' };
  const el = document.createElement('div');
  el.className = 'fixed bottom-6 right-6 z-[9999] px-5 py-3 rounded-2xl text-white font-bold shadow-2xl bg-gradient-to-r toast-in ' + (colors[type] || colors.info);
  el.style.maxWidth = '360px';
  el.style.wordBreak = 'break-word';
  el.innerHTML = '<span class="mr-2">' + (icons[type] || '') + '</span>' + esc(msg);
  document.body.appendChild(el);
  setTimeout(function() {
    el.classList.remove('toast-in');
    el.classList.add('toast-out');
    setTimeout(function() { el.remove(); }, 300);
  }, 3200);
}

// =================================================================
// IMAGE HELPERS
// =================================================================
function compressImage(file) {
  return new Promise(function(resolve, reject) {
    if (!file || !file.type || file.type.indexOf('image/') !== 0) {
      return reject(new Error('File bukan gambar'));
    }
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        try {
          let w = img.width, h = img.height;
          if (w > IMAGE_MAX_DIMENSION || h > IMAGE_MAX_DIMENSION) {
            if (w > h) { h = Math.round(h * IMAGE_MAX_DIMENSION / w); w = IMAGE_MAX_DIMENSION; }
            else { w = Math.round(w * IMAGE_MAX_DIMENSION / h); h = IMAGE_MAX_DIMENSION; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          const dataUrl = canvas.toDataURL('image/jpeg', IMAGE_QUALITY);
          const base64 = dataUrl.split(',')[1];
          const newName = (file.name || 'image').replace(/\.[^.]+$/, '') + '_' + Date.now() + '.jpg';
          resolve({ base64: base64, mimeType: 'image/jpeg', name: newName, dataUrl: dataUrl, size: Math.round(base64.length * 0.75) });
        } catch (err) { reject(err); }
      };
      img.onerror = function() { reject(new Error('Gagal membaca gambar')); };
      img.src = e.target.result;
    };
    reader.onerror = function() { reject(new Error('Gagal membaca file')); };
    reader.readAsDataURL(file);
  });
}

// =================================================================
// API WRAPPER — panggil Apps Script via fetch
// =================================================================
async function api(fnName) {
  const args = Array.prototype.slice.call(arguments, 1);
  const payload = { fn: fnName, args: [token()].concat(args) };
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload),
      redirect: 'follow'
    });
    if (!res.ok) throw new Error('HTTP error ' + res.status);
    const json = await res.json();
    if (!json.ok) {
      const msg = json.error || 'Unknown error';
      if (msg.indexOf('Sesi habis') !== -1 || msg.indexOf('Sesi tidak ditemukan') !== -1 || msg.indexOf('Silakan login ulang') !== -1) {
        resetStateToLoggedOut();
        showToast('Sesi habis. Silakan login ulang.', 'warn');
        render();
        return Promise.reject(new Error(msg));
      }
      throw new Error(msg);
    }
    return json.data;
  } catch (err) {
    throw new Error(err.message || String(err));
  }
}

async function apiLogin(fnName) {
  const args = Array.prototype.slice.call(arguments, 1);
  const payload = { fn: fnName, args: args };
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload),
      redirect: 'follow'
    });
    if (!res.ok) throw new Error('HTTP error ' + res.status);
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || 'Unknown error');
    return json.data;
  } catch (err) {
    throw new Error(err.message || String(err));
  }
}

async function handleImageSelect(event) {
  const files = Array.from(event.target.files || []);
  if (event.target.value !== undefined) try { event.target.value = ''; } catch (e) {}
  if (!files.length || !S.editingMateri) return;
  const currentCount = (S.editingMateri.images || []).length;
  const maxNew = Math.max(0, 20 - currentCount);
  if (maxNew === 0) return showToast('Sudah mencapai batas 20 gambar', 'warn');
  const toProcess = files.slice(0, maxNew);
  if (files.length > maxNew) showToast('Hanya ' + maxNew + ' file pertama yang diproses (maks 20)', 'warn');
  S.uploadingImages = true;
  S.uploadProgress = 'Mengompres ' + toProcess.length + ' gambar...';
  render();
  const compressed = [];
  for (let i = 0; i < toProcess.length; i++) {
    try {
      S.uploadProgress = 'Kompres ' + (i + 1) + '/' + toProcess.length + '...';
      render();
      const result = await compressImage(toProcess[i]);
      compressed.push(result);
    } catch (e) {
      showToast('Gagal kompres: ' + toProcess[i].name, 'error');
    }
  }
  if (!compressed.length) {
    S.uploadingImages = false; S.uploadProgress = ''; render();
    return showToast('Tidak ada gambar valid', 'error');
  }
  S.uploadProgress = 'Mengunggah ' + compressed.length + ' gambar ke Drive...';
  render();
  try {
    const payload = compressed.map(function(c) { return { name: c.name, base64: c.base64, mimeType: c.mimeType }; });
    const res = await api('uploadMultipleImages', payload);
    if (res.images && res.images.length) {
      S.editingMateri.images = (S.editingMateri.images || []).concat(res.images);
    }
    playDing();
    showToast('✅ ' + (res.uploaded || 0) + ' gambar berhasil diunggah', 'success');
    if (res.failed && res.failed > 0) showToast('⚠️ ' + res.failed + ' gambar gagal', 'warn');
    if (S.editingMateri.type !== 'image') S.editingMateri.type = 'image';
  } catch (err) {
    showToast('Gagal upload: ' + err.message, 'error');
  }
  S.uploadingImages = false; S.uploadProgress = ''; render();
}

async function removeImageFromEditing(idx) {
  if (!S.editingMateri || !S.editingMateri.images) return;

async function startScanner() {
  if (S.scannerInstance) return;
  if (typeof Html5Qrcode === 'undefined') {
    showToast('Library QR belum siap. Refresh halaman.', 'error');
    return;
  }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showToast('Browser tidak mendukung kamera. Gunakan Chrome/Safari terbaru.', 'error');
    return;
  }
  if (window.location.protocol !== 'https:' && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
    showToast('Kamera hanya bisa diakses via HTTPS.', 'error');
    return;
  }

  S.scannerActive = true;
  S.scanCooldown = {};
  render();

  try {
    await new Promise(function(r) { setTimeout(r, 400); });
    const html5QrCode = new Html5Qrcode("qr-reader");
    S.scannerInstance = html5QrCode;
    await html5QrCode.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: 250 },
      function(decodedText) {
        const sid = parseInt(decodedText, 10);
        const now = Date.now();
        if (S.scanCooldown[sid] && (now - S.scanCooldown[sid]) < 3000) return;
        S.scanCooldown[sid] = now;
        const student = S.students.find(function(s) { return s.id === sid; });
        if (!student) { showToast('QR tidak dikenal: ' + decodedText, 'error'); return; }
        playDing();
        if (S.selectedStudents.indexOf(sid) === -1) S.selectedStudents.push(sid);
        api('savePointsMulti', [sid], [{ ruleId: getKehadiranRuleId(), multiplier: 1 }]).then(function(res) {
          showToast('✅ ' + student.name + ' +' + res.totalPoints + ' poin', 'success');
          loadData();
        }).catch(function(err) { showToast('Gagal: ' + err.message, 'error'); });
      },
      function(errorMessage) {}
    );
  } catch (err) {
    const msg = (err && err.message) ? err.message
              : (err && err.name) ? err.name
              : (typeof err === 'string') ? err
              : 'Izin kamera ditolak atau kamera sedang dipakai aplikasi lain';
    showToast('Kamera gagal: ' + msg, 'error');
    try {
      if (S.scannerInstance) {
        try { await S.scannerInstance.stop(); } catch (e) {}
        try { S.scannerInstance.clear(); } catch (e) {}
      }
    } catch (e) {}
    S.scannerInstance = null;
    S.scannerActive = false;
    render();
  }
}

async function stopScanner() {
  try { if (S.scannerInstance) { await S.scannerInstance.stop(); S.scannerInstance.clear(); S.scannerInstance = null; } } catch (e) {}
  S.scannerActive = false; render();
}
function getKehadiranRuleId() {
  const r = S.rules.find(function(x) { return x.name.toLowerCase().indexOf('kehadiran') !== -1; });
  return r ? r.id : (S.rules[0] ? S.rules[0].id : 1);

// =================================================================
// RENDER MAIN
// =================================================================
function render() {
  const activeEl = document.activeElement;
  const activeId = activeEl && activeEl.id ? activeEl.id : null;
  let selStart = null, selEnd = null;
  try {
    if (activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA' || activeEl.tagName === 'SELECT')) {
      if (activeEl.selectionStart !== undefined) { selStart = activeEl.selectionStart; selEnd = activeEl.selectionEnd; }
    }
  } catch (e) {}
  const app = document.getElementById('app');
  if (S.loading) {
    app.innerHTML = '<div class="min-h-screen flex items-center justify-center" style="background:linear-gradient(135deg,#fef3c7,#fce7f3,#e0e7ff);">' +
      '<div class="bg-white rounded-3xl shadow-2xl p-12 text-center border-4 border-yellow-300">' +
      '<div class="text-6xl mb-3 spin">&#9881;</div>' +
      '<p class="text-gray-600 font-bold text-lg">Memuat...</p></div></div>';
    return;
  }
  if (S.error) {
    app.innerHTML = '<div class="min-h-screen bg-red-50 flex items-center justify-center p-4">' +
      '<div class="bg-white rounded-3xl shadow-2xl p-8 max-w-md text-center border-4 border-red-200">' +
      '<div class="text-6xl mb-4">⚠</div>' +
      '<h2 class="text-2xl font-bold text-red-700 mb-2">Ups, ada masalah</h2>' +
      '<p class="text-gray-600 mb-4 text-sm">' + esc(S.error) + '</p>' +
      '<button onclick="retry()" class="btn-kid bg-blue-500 text-white font-bold px-6 py-3">Coba Lagi</button></div></div>';
    return;
  }

      const isSelected = S.selectedRules[r.id] !== undefined;
      const cls = (r.points >= 0 ? 'rule-pos' : 'rule-neg') + (isSelected ? ' selected' : '');

function viewSantriDashboard() {
  const s = S.students.find(function(x) { return x.id === S.user.data.id; }) || S.user.data;
  const pts = s.points || 0;
  const nextTarget = Math.ceil((pts + 1) / 10) * 10 || 10;
  const progress = Math.min(100, Math.max(0, (pts / nextTarget) * 100));
  const radius = 60;
  const circumference = 2 * Math.PI * radius;
  const offset = circumference - (progress / 100) * circumference;
  let badgeHtml = '';
  if (S.santriBadges.length === 0) badgeHtml = '<p class="text-xs text-gray-400 italic">Belum ada badge</p>';

    '<div class="card-kid bg-white p-6">' +
    '<h3 class="font-bold text-lg mb-3 flex items-center gap-2 font-head"><span class="text-2xl">🏅</span> Badge yang Diraih</h3><div>' + badgeHtml + '</div></div>' +
    '<div class="grid grid-cols-2 sm:grid-cols-4 gap-4">' +

function viewSantriTerbaik() {
  const sorted = S.students.slice().sort(function(a, b) { return b.points - a.points; });
  const medals = ['🥇','🥈','🥉'];
  const myId = S.user.data.id;
  let myRank = 0;
  for (let i = 0; i < sorted.length; i++) { if (sorted[i].id === myId) { myRank = i + 1; break; } }
  const top3 = sorted.slice(0, 3);
  let topCards = '';
  top3.forEach(function(s, i) {

async function submitMutabaah(e) {
  e.preventDefault();
  const fd = new FormData(e.target);
  const data = { studentId: S.user.data.id,
    subuh: fd.get('subuh') === 'on', dzuhur: fd.get('dzuhur') === 'on', ashar: fd.get('ashar') === 'on',
    maghrib: fd.get('maghrib') === 'on', isya: fd.get('isya') === 'on',
    ngaji: fd.get('ngaji') === 'on', bantuOrtu: fd.get('bantuOrtu') === 'on' };
  S.submitting = true; render();
  try { await api('saveMutabaah', data); playDing(); playConfetti(); showToast('Alhamdulillah! Catatan tersimpan.', 'success'); e.target.reset(); }
  catch (err) { showToast('Gagal: ' + err.message, 'error'); }
  S.submitting = false; render();
}

  return '<div class="space-y-6 fade-in">' +

function viewMateri() {
  const typeColors = { text:'from-blue-100 to-cyan-100 border-blue-300', pdf:'from-red-100 to-orange-100 border-red-300', image:'from-purple-100 to-pink-100 border-purple-300', video:'from-rose-100 to-pink-100 border-rose-300', audio:'from-green-100 to-emerald-100 border-green-300', link:'from-cyan-100 to-blue-100 border-cyan-300' };
  const typeIcons = { text:'📄', pdf:'📕', image:'🖼', video:'🎥', audio:'🎵', link:'🔗' };
  let cards = '';
  if (S.materials.length === 0) cards = '<p class="text-gray-400 text-center py-8 col-span-full">Belum ada materi.</p>';
  else S.materials.forEach(function(m) {
    const imgCount = (m.images && m.images.length) ? m.images.length : 0;
    const thumb = imgCount > 0 ? m.images[0].url : null;
    cards += '<div class="bg-gradient-to-br ' + (typeColors[m.type] || 'from-gray-100 to-gray-200 border-gray-300') + ' rounded-3xl p-5 border-2 flex flex-col overflow-hidden">' +
      (thumb ? '<div class="rounded-2xl overflow-hidden bg-white mb-3" style="height:140px;"><img src="' + esc(thumb) + '" style="width:100%;height:100%;object-fit:cover;" /></div>' : '<div class="flex items-center gap-3 mb-3"><div class="w-14 h-14 rounded-2xl bg-white flex items-center justify-center text-3xl shadow-sm">' + (typeIcons[m.type] || '📄') + '</div></div>') +
      '<h3 class="font-bold text-lg text-gray-800 truncate">' + esc(m.title) + '</h3>' +
      (m.desc ? '<p class="text-gray-600 text-xs truncate mb-2">' + esc(m.desc) + '</p>' : '') +
      (imgCount > 1 ? '<div class="text-xs text-purple-600 font-bold mb-2">📸 ' + imgCount + ' gambar</div>' : '') +
      '<button onclick="openPreviewMateri(' + m.id + ')" class="btn-kid w-full mt-auto bg-gradient-to-r from-blue-400 to-blue-500 text-white py-2.5 text-sm">Buka Materi</button></div>';
  });

  let preview = '';
  if (S.previewMateri) {
    const m = S.previewMateri;
    let body = '';
    if (m.type === 'image') {
      const imgs = m.images || [];
      if (imgs.length > 0) {
        let thumbs = '';
        imgs.forEach(function(img, idx) {
          thumbs += '<div onclick="openLightbox(' + JSON.stringify(imgs).replace(/"/g, '&quot;') + ',' + idx + ')" class="cursor-pointer rounded-2xl overflow-hidden bg-gray-100" style="width:180px;height:180px;">' +
            '<img src="' + esc(img.url) + '" style="width:100%;height:100%;object-fit:cover;" />' +
            '</div>';
        });
        body = '<div class="gallery-scroll">' + thumbs + '</div>' +
          '<div class="text-center text-xs text-gray-500 mt-2">👆 Klik gambar untuk melihat ukuran penuh · ' + imgs.length + ' gambar</div>' +
          (m.content ? '<div class="mt-4 border-t-2 border-gray-100 pt-3"><p class="text-xs text-gray-500 mb-1">URL tambahan:</p><a href="' + esc(m.content) + '" target="_blank" class="text-blue-500 underline break-all text-xs">' + esc(m.content) + '</a></div>' : '');
      } else if (m.content) {
        body = '<img src="' + esc(m.content) + '" class="w-full rounded-2xl max-h-96 object-contain" onerror="this.onerror=null;this.style.display=\'none\';this.nextElementSibling.style.display=\'block\';" />' +
          '<div style="display:none;" class="text-center mt-3">' +
          '<p class="text-red-500 text-sm mb-2">Gambar tidak dapat ditampilkan langsung.</p>' +
          '<a href="' + esc(m.content) + '" target="_blank" rel="noopener" class="btn-kid bg-blue-500 text-white px-4 py-2 text-sm inline-block">Buka Gambar di Tab Baru</a>' +
          '</div>';
      } else {
        body = '<p class="text-gray-400 text-center py-8">Materi ini belum punya gambar.</p>';
      }
    }
    else if (m.type === 'video') {
      const ytId = extractYouTubeId(m.content);
      if (ytId) body = '<div class="video-wrap"><iframe src="https://www.youtube-nocookie.com/embed/' + ytId + '?rel=0&modestbranding=1&playsinline=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>';
      else body = '<div class="bg-gray-100 rounded-2xl p-8 text-center"><p class="text-gray-600 mb-3">URL video tidak valid.</p><a href="' + esc(m.content) + '" target="_blank" class="btn-kid bg-red-500 text-white px-6 py-2 inline-block">Buka Video</a></div>';
    }
    else if (m.type === 'audio') body = '<audio controls src="' + esc(m.content) + '" class="w-full"></audio>';
    else if (m.type === 'pdf') body = '<iframe src="' + esc(m.content) + '" class="w-full rounded-2xl" style="height:500px;border:0;"></iframe>';
    else if (m.type === 'link') body = '<a href="' + esc(m.content) + '" target="_blank" class="text-blue-500 underline break-all">' + esc(m.content) + '</a>';
    else body = '<p class="text-gray-700 whitespace-pre-line">' + esc(m.content) + '</p>';
    preview = '<div class="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-50 p-4" onclick="closePreview()">' +
      '<div class="bg-white p-6 max-w-3xl w-full max-h-screen overflow-y-auto" style="border-radius:28px;border:4px solid #60a5fa;" onclick="event.stopPropagation()">' +
      '<div class="flex justify-between items-center mb-4"><h3 class="font-bold text-xl">' + esc(m.title) + '</h3>' +
      '<button onclick="closePreview()" class="text-gray-400 text-2xl">&times;</button></div>' + body + '</div></div>';
  }
  return '<div class="card-kid bg-white p-6 sm:p-8 fade-in">' +
    '<div class="flex items-center gap-3 mb-6"><div class="w-14 h-14 rounded-full bg-gradient-to-br from-pink-300 to-rose-400 flex items-center justify-center text-3xl shadow-md">📚</div>' +
    '<div><h2 class="text-2xl font-bold font-head">Materi Pembelajaran</h2><p class="text-gray-500 text-sm">Yuk belajar hal baru!</p></div></div>' +
    '<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">' + cards + '</div>' + preview + '</div>';
}

function viewJadwal() {
  const kelasList = getKelasList();
  let filterOpts = '<option value="">Semua Kelas</option>';
  kelasList.forEach(function(k) { filterOpts += '<option value="' + esc(k) + '" ' + (S.jadwalKelas === k ? 'selected' : '') + '>' + esc(k) + '</option>'; });
  let list = S.jadwalList;
  if (S.jadwalKelas) list = list.filter(function(j) { return j.kelas === S.jadwalKelas; });
  const grouped = {};
  HARI.forEach(function(h) { grouped[h] = []; });
  list.forEach(function(j) { if (grouped[j.hari]) grouped[j.hari].push(j); });
  let content = '';
  HARI.forEach(function(h) {
    if (grouped[h].length === 0) return;
    content += '<div class="mb-4"><div class="bg-gradient-to-r from-cyan-400 to-blue-500 text-white px-4 py-2 rounded-t-2xl font-bold">' + h + '</div>' +
      '<div class="bg-white border-2 border-cyan-200 rounded-b-2xl divide-y divide-cyan-100">';
    grouped[h].forEach(function(j) {
      content += '<div class="p-3 flex items-center justify-between gap-3">' +
        '<div class="flex-1"><div class="font-bold text-gray-800">' + esc(j.mapel) + '</div>' +
        '<div class="text-xs text-gray-500">' + esc(j.jam) + ' · ' + esc(j.guru) + ' · ' + esc(j.kelas) + '</div></div>' +
        (S.user.role === 'admin' ? '<div class="flex gap-1">' +
          '<button onclick="openEditJadwal(' + j.id + ')" class="bg-blue-100 text-blue-700 p-2 rounded-lg text-xs font-bold">Edit</button>' +
          '<button onclick="deleteJadwal(' + j.id + ')" class="bg-red-100 text-red-700 p-2 rounded-lg text-xs font-bold">Hapus</button>' +
          '</div>' : '') + '</div>';
    });
    content += '</div></div>';
  });
  if (content === '') content = '<p class="text-center text-gray-400 py-8">Belum ada jadwal.</p>';
  let modal = '';
  if (S.editingJadwal) {
    const ed = S.editingJadwal;
    let kelasOpts = '';
    kelasList.forEach(function(k) { kelasOpts += '<option value="' + esc(k) + '" ' + (ed.kelas === k ? 'selected' : '') + '>' + esc(k) + '</option>'; });
    let hariOpts = '';
    HARI.forEach(function(h) { hariOpts += '<option value="' + h + '" ' + (ed.hari === h ? 'selected' : '') + '>' + h + '</option>'; });
    modal = '<div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">' +
      '<form onsubmit="saveJadwal(event)" class="bg-white p-6 max-w-md w-full shadow-2xl fade-in" style="border-radius:28px;border:4px solid #06b6d4;">' +
      '<div class="flex justify-between items-center mb-4"><h3 class="font-bold text-xl">' + (ed.id ? 'Edit' : 'Tambah') + ' Jadwal</h3>' +
      '<button type="button" onclick="closeJadwalModal()" class="text-gray-400 text-2xl">&times;</button></div>' +
      '<div class="space-y-3">' +
      '<select onchange="S.editingJadwal.kelas=this.value" class="w-full bg-yellow-50 border-2 border-yellow-200 rounded-2xl px-4 py-3 font-medium">' + kelasOpts + '</select>' +
      '<select onchange="S.editingJadwal.hari=this.value" class="w-full bg-yellow-50 border-2 border-yellow-200 rounded-2xl px-4 py-3 font-medium">' + hariOpts + '</select>' +
      '<input type="text" required value="' + esc(ed.jam) + '" oninput="S.editingJadwal.jam=this.value" class="w-full bg-yellow-50 border-2 border-yellow-200 rounded-2xl px-4 py-3" placeholder="Jam" />' +
      '<input type="text" required value="' + esc(ed.mapel) + '" oninput="S.editingJadwal.mapel=this.value" class="w-full bg-yellow-50 border-2 border-yellow-200 rounded-2xl px-4 py-3" placeholder="Mata pelajaran" />' +
      '<input type="text" required value="' + esc(ed.guru) + '" oninput="S.editingJadwal.guru=this.value" class="w-full bg-yellow-50 border-2 border-yellow-200 rounded-2xl px-4 py-3" placeholder="Nama guru" />' +
      '<div class="flex gap-3 pt-2"><button type="button" onclick="closeJadwalModal()" class="btn-kid flex-1 bg-gray-200 py-3">Batal</button>' +
      '<button type="submit" class="btn-kid flex-1 bg-gradient-to-r from-cyan-400 to-blue-500 text-white py-3">Simpan</button></div></div></form></div>';
  }
  return '<div class="space-y-6 fade-in">' +
    '<div class="card-kid bg-white p-6 flex flex-wrap justify-between items-center gap-4">' +
    '<div class="flex items-center gap-3"><div class="w-14 h-14 rounded-full bg-gradient-to-br from-cyan-300 to-blue-400 flex items-center justify-center text-3xl">📅</div>' +
    '<div><h2 class="text-2xl font-bold font-head">Jadwal Pelajaran</h2></div></div>' +
    '<div class="flex gap-2 items-center">' +
    '<select onchange="S.jadwalKelas=this.value;loadJadwal().then(render);" class="bg-yellow-50 border-2 border-yellow-200 rounded-2xl px-4 py-2 font-medium">' + filterOpts + '</select>' +

    '</div></div>' + modal + '<div class="card-kid bg-white p-6">' + content + '</div></div>';
}

function viewSantriGrafik() {
  if (!S.grafikLoaded) {
    loadGrafik().then(render);
    return '<div class="card-kid bg-white p-8 text-center"><div class="text-6xl mb-3 spin">&#9881;</div><p class="text-gray-500">Memuat grafik...</p></div>';
  }
  if (S.santriGrafik.length === 0) {
    return '<div class="card-kid bg-white p-8 text-center"><div class="text-6xl mb-3">📈</div><p class="text-gray-500 font-bold">Belum ada data poin.</p><p class="text-gray-400 text-sm mt-2">Yuk kumpulkan poinnya!</p></div>';
  }
  const maxVal = Math.max(10, Math.max.apply(null, S.santriGrafik.map(function(g) { return Math.abs(g.total); })));
  const width = 500, height = 220, padding = 40;
  const barWidth = (width - padding * 2) / S.santriGrafik.length;
  let bars = '';
  S.santriGrafik.forEach(function(g, i) {
    const val = g.total;
    const barH = Math.abs(val) / maxVal * (height - padding * 2);
    const x = padding + i * barWidth + 10;
    const y = val >= 0 ? (height - padding - barH) : (height - padding);
    const color = val >= 0 ? '#34d399' : '#f87171';
    bars += '<rect x="' + x + '" y="' + y + '" width="' + (barWidth - 20) + '" height="' + barH + '" fill="' + color + '" rx="6" />';
    bars += '<text x="' + (x + (barWidth - 20) / 2) + '" y="' + (val >= 0 ? y - 8 : y + barH + 18) + '" text-anchor="middle" font-size="12" font-weight="bold" fill="#374151">' + val + '</text>';
    bars += '<text x="' + (x + (barWidth - 20) / 2) + '" y="' + (height - 10) + '" text-anchor="middle" font-size="10" fill="#6b7280">' + g.label + '</text>';
  });
  const totalSemua = S.santriGrafik.reduce(function(a, g) { return a + g.total; }, 0);
  const bulanBest = S.santriGrafik.reduce(function(a, b) { return (b.total > a.total) ? b : a; }, S.santriGrafik[0]);
  return '<div class="space-y-6 fade-in">' +
    '<div class="card-kid bg-gradient-to-r from-teal-300 to-cyan-400 p-6 text-white">' +
    '<div class="flex items-center gap-4"><div class="text-5xl float">📈</div>' +
    '<div><h2 class="text-2xl font-bold font-head">Grafik Poin Saya</h2></div></div></div>' +
    '<div class="card-kid bg-white p-6"><svg viewBox="0 0 ' + width + ' ' + height + '" class="w-full">' + bars + '</svg></div>' +
    '<div class="grid grid-cols-2 gap-4">' +
    '<div class="card-kid bg-gradient-to-br from-yellow-50 to-amber-100 p-4 text-center">' +
    '<div class="text-3xl mb-1">📊</div><div class="text-xs text-gray-600 font-bold">TOTAL 6 BULAN</div>' +
    '<div class="text-3xl font-black text-amber-700">' + totalSemua + '</div></div>' +
    '<div class="card-kid bg-gradient-to-br from-green-50 to-emerald-100 p-4 text-center">' +
    '<div class="text-3xl mb-1">🏆</div><div class="text-xs text-gray-600 font-bold">BULAN TERBAIK</div>' +
    '<div class="text-3xl font-black text-emerald-700">' + bulanBest.label + '</div></div></div></div>';
}

  return '<div class="card-kid bg-white p-6 sm:p-8 max-w-md mx-auto fade-in">' +

}
async function changePinSubmit(e) {
  const fd = new FormData(e.target);
  const oldPin = fd.get('oldPin'), newPin = fd.get('newPin'), confirmPin = fd.get('confirmPin');
  if (newPin !== confirmPin) return showToast('PIN baru tidak sama!', 'warn');
  if (String(newPin).length < 4) return showToast('PIN minimal 4 digit', 'warn');
  S.submitting = true; render();
  try {
    await api('changeSantriPin', oldPin, newPin);
    playDing(); showToast('PIN berhasil diubah!', 'success');
    e.target.reset();
  } catch (err) { showToast('Gagal: ' + err.message, 'error'); }
  S.submitting = false; render();
}

// Drag & drop untuk upload zone
document.addEventListener('dragover', function(e) {
  const zone = e.target.closest && e.target.closest('.upload-zone');
  if (zone) { e.preventDefault(); zone.classList.add('dragover'); }
});
document.addEventListener('dragleave', function(e) {
  const zone = e.target.closest && e.target.closest('.upload-zone');
  if (zone) zone.classList.remove('dragover');
});
document.addEventListener('drop', function(e) {
  const zone = e.target.closest && e.target.closest('.upload-zone');
  if (!zone) return;
  e.preventDefault();
  zone.classList.remove('dragover');
  const input = zone.querySelector('input[type=file]');
  if (!input || input.disabled) return;
  const files = e.dataTransfer.files;
  if (files && files.length) {
    if (S.editingMateri) {
      handleImageSelect({ target: { files: files } });
    } else if (S.editingReward) {
      handleRewardImageSelect({ target: { files: files } });
    }
  }
});

async function goto(view) {
  S.view = view;
  if (view === 'riwayat') await loadRiwayat();
  else if (view === 'rekap_kehadiran') await loadKehadiran();
  else if (view === 'kehadiran_input') await loadAbsenData();
  else if (view === 'arsip') await loadArsipList();
  else if (view === 'jadwal') await loadJadwal();
  else if (view === 'users') await loadUsers();
  else if (view === 'kuis') await loadKuis();
  else if (view === 'kuis_santri') await loadKuis();
  else if (view === 'evaluasi') await loadEvaluasi();
  else if (view === 'badge_saya') await loadSantriBadges();
  else if (view === 'grafik') await loadGrafik();
  else if (view === 'reward') await loadRedemptions();
  render();
}
async function selectArsip(p) {
  S.arsipSelected = p;
  try { S.arsipData = await api('getArsipPoin', p); }
  catch (err) { showToast('Gagal: ' + err.message, 'error'); }
  render();
}

// =================================================================
// BOOT
// =================================================================
(function boot() {
  const savedUser = sessionStorage.getItem('tpq_user');
  if (savedUser && token()) {
    try { S.user = JSON.parse(savedUser); } catch (e) {}
  }
  Promise.all([loadData(), loadJadwal()]).then(function() {
    if (S.user && S.user.role === 'santri') {
      return Promise.all([loadSantriBadges(), loadGrafik()]);
    }
  }).catch(function() {}).then(function() {
    S.loading = false;
    render();
  });
})();
</script>
