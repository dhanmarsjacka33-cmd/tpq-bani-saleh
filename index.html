/* ==== BASE ==== */
*{-webkit-tap-highlight-color:transparent;}
body{margin:0;font-family:'Fredoka',system-ui,sans-serif;background:#fef9f3;transition:background .3s,color .3s;overflow-x:hidden;}
h1,h2,h3,.font-head{font-family:'Baloo 2','Fredoka',system-ui,sans-serif;font-weight:700;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#fcd34d;border-radius:8px;}
::-webkit-scrollbar-track{background:#fef3c7;}
.hide-scroll::-webkit-scrollbar{display:none;}
.hide-scroll{-ms-overflow-style:none;scrollbar-width:none;}

/* ==== ANIMATIONS ==== */
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .25s ease-out;}
@keyframes toastIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
@keyframes toastOut{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(40px)}}
.toast-in{animation:toastIn .3s ease-out;}
.toast-out{animation:toastOut .3s ease-in forwards;}
@keyframes wiggle{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.wiggle{animation:wiggle 2s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.float{animation:float 3s ease-in-out infinite;}
@keyframes pulse-soft{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.pulse-soft{animation:pulse-soft 2s ease-in-out infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 1s linear infinite;display:inline-block;}
@keyframes confetti-fall{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--cx),400px) rotate(720deg);opacity:0}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.slide-up{animation:slideUp .25s ease-out;}

/* ==== CARDS & BUTTONS ==== */
.card-kid{border-radius:18px;box-shadow:0 3px 0 rgba(0,0,0,.06),0 6px 16px rgba(0,0,0,.05);border:2px solid #fff;transition:transform .2s,box-shadow .2s,background .3s;}
.card-kid:hover{transform:translateY(-2px);}
.btn-kid{border-radius:16px;border-bottom:3px solid rgba(0,0,0,.15);transition:transform .15s,border-width .15s;font-weight:700;}
.btn-kid:active{transform:translateY(1px);border-bottom-width:1px;}
.btn-kid:disabled{opacity:.45;cursor:not-allowed;}

/* ==== PAGE HEADER (Compact) ==== */
.page-header{display:flex;align-items:center;gap:10px;padding:6px 0 12px;margin-bottom:12px;border-bottom:2px solid #fef3c7;}
.page-header .icon-badge{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#fbbf24,#f97316);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;box-shadow:0 3px 8px rgba(245,158,11,.3);}
.page-header h1{font-size:18px;font-weight:800;color:#1f2937;margin:0;line-height:1.2;}
.page-header .sub{font-size:11px;color:#9ca3af;line-height:1.3;}

/* ==== BOTTOM NAV ==== */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:50;background:white;border-top:2px solid #fef3c7;display:flex;justify-content:space-around;align-items:center;height:62px;padding:0 4px;box-shadow:0 -2px 12px rgba(0,0,0,.08);padding-bottom:env(safe-area-inset-bottom);}
.bottom-nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;background:transparent;border:0;font-size:10px;font-weight:700;color:#9ca3af;transition:color .15s,transform .15s;cursor:pointer;font-family:inherit;}
.bottom-nav button .icon{font-size:22px;line-height:1;}
.bottom-nav button.active{color:#f59e0b;transform:scale(1.05);}

/* ==== STUDENT ROW (Compact) ==== */
.student-row{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:14px;background:white;border:2px solid #f3f4f6;margin-bottom:6px;cursor:pointer;transition:all .15s;}
.student-row:active{transform:scale(.99);}
.student-row.selected{background:linear-gradient(135deg,#dbeafe,#bfdbfe);border-color:#3b82f6;box-shadow:0 2px 8px rgba(59,130,246,.2);}
.student-row .check{width:24px;height:24px;border-radius:6px;border:2px solid #cbd5e1;background:white;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;flex-shrink:0;color:transparent;}
.student-row.selected .check{background:#3b82f6;border-color:#3b82f6;color:white;}
.student-row .info{flex:1;min-width:0;}
.student-row .name{font-weight:700;font-size:14px;color:#1f2937;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.student-row .meta{font-size:11px;color:#6b7280;display:flex;gap:4px;align-items:center;flex-wrap:wrap;}
.student-row .points{font-size:16px;font-weight:900;flex-shrink:0;}
.student-row .points.pos{color:#10b981;}
.student-row .points.neg{color:#ef4444;}

/* ==== STATUS GROUP (Compact Inline) ==== */
.status-group{display:inline-flex;gap:2px;padding:2px;background:#f3f4f6;border-radius:10px;flex-shrink:0;}
.status-mini{padding:5px 7px;border-radius:7px;font-size:12px;border:0;cursor:pointer;background:transparent;transition:all .15s;line-height:1;font-family:inherit;}
.status-mini.active-hadir{background:#10b981;}
.status-mini.active-sakit{background:#f59e0b;}
.status-mini.active-izin{background:#3b82f6;}
.status-mini.active-alfa{background:#ef4444;}

/* ==== CHIP ==== */
.chip-santri{display:inline-flex;align-items:center;gap:4px;background:linear-gradient(135deg,#dbeafe,#bfdbfe);color:#1e40af;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:700;border:2px solid #93c5fd;}
.chip-santri button{width:15px;height:15px;border-radius:50%;background:#ef4444;color:#fff;font-weight:900;font-size:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:0;line-height:1;}

/* ==== BOTTOM SHEET ==== */
.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:90;animation:fadeIn .2s;}
.bottom-sheet{position:fixed;bottom:0;left:0;right:0;z-index:91;background:white;border-radius:24px 24px 0 0;max-height:82vh;overflow-y:auto;padding:12px 16px 24px;animation:slideUp .25s ease-out;padding-bottom:calc(24px + env(safe-area-inset-bottom));box-shadow:0 -8px 32px rgba(0,0,0,.15);}
.bottom-sheet .handle{width:40px;height:4px;background:#d1d5db;border-radius:2px;margin:0 auto 12px;}

/* ==== FILTER DETAILS ==== */
.filter-details summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#6b7280;padding:4px 0;}
.filter-details summary::-webkit-details-marker{display:none;}
.filter-details summary::before{content:'▸';transition:transform .2s;font-size:10px;}
.filter-details[open] summary::before{transform:rotate(90deg);}

/* ==== QR & VIDEO ==== */
.video-wrap{position:relative;width:100%;padding-bottom:56.25%;height:0;background:#000;border-radius:16px;overflow:hidden;}
.video-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;}
#qr-reader{border-radius:16px;overflow:hidden;}
#qr-reader video{border-radius:16px;}

/* ==== RULE CHECKBOX (untuk sheet) ==== */
.rule-checkbox{width:20px;height:20px;border-radius:6px;border:2px solid #cbd5e1;background:white;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:transparent;font-size:12px;font-weight:900;}

/* ==== IMAGE THUMB ==== */
.img-thumb{position:relative;width:100%;padding-bottom:100%;border-radius:14px;overflow:hidden;border:2px solid white;background:#f3f4f6;}
.img-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.img-thumb .remove-btn{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:#ef4444;color:#fff;border:2px solid #fff;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.25);font-size:12px;line-height:1;}
.gallery-scroll{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;}
.gallery-scroll>div{flex-shrink:0;scroll-snap-align:center;}
.upload-zone{border:3px dashed #a78bfa;border-radius:16px;padding:18px;text-align:center;cursor:pointer;transition:all .2s;background:#faf5ff;display:block;}
.upload-zone:active{border-color:#7c3aed;background:#f3e8ff;}
.upload-zone.dragover{border-color:#7c3aed;background:#ede9fe;transform:scale(1.02);}
.upload-zone.disabled{opacity:.5;pointer-events:none;}

/* ==== PRINT ==== */
.rapor-header{background:linear-gradient(135deg,#fbbf24 0%,#fb923c 100%);-webkit-print-color-adjust:exact;print-color-adjust:exact;}
@media print{
  @page{margin:12mm}
  body{background:#fff!important}
  body *{visibility:hidden}
  #print-area,#print-area *{visibility:visible}
  #print-area{position:absolute;left:0;top:0;width:100%;padding:0;background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .no-print{display:none!important}
  .card-kid{box-shadow:none!important;border:2px solid #fbbf24!important;page-break-inside:avoid}
}

body.dark-mode .status-group{background:#334155!important;}
body.dark-mode .bottom-nav button{color:#64748b;}
body.dark-mode .bottom-nav button.active{color:#fbbf24;}
body.dark-mode .page-header{border-color:#334155;}
body.dark-mode .page-header h1{color:#e2e8f0;}

/* ==== SAFE AREA ==== */
@supports(padding:max(0px)){
  .bottom-nav{padding-bottom:max(env(safe-area-inset-bottom),0px);}
}
</style>

function esc(s){if(s===null||s===undefined)return '';return String(s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];});}

function showToast(msg,type,opts){
  type=type||'info';opts=opts||{};
  const colors={success:'from-green-400 to-emerald-500',error:'from-red-400 to-rose-500',info:'from-blue-400 to-indigo-500',warn:'from-amber-400 to-orange-500'};
  const icons={success:'✅',error:'⚠️',info:'ℹ️',warn:'⚡'};
  const el=document.createElement('div');
  el.className='fixed bottom-24 right-4 left-4 sm:left-auto sm:right-6 z-[9999] px-4 py-3 rounded-2xl text-white font-bold shadow-2xl bg-gradient-to-r toast-in text-sm '+(colors[type]||colors.info);
  el.style.maxWidth='420px';el.style.marginLeft='auto';el.style.wordBreak='break-word';
  let inner='<span class="mr-2">'+(icons[type]||'')+'</span>'+esc(msg);
  if(opts.undo&&S.lastUndo){inner+=' <button data-action="do-undo" class="ml-2 bg-white/20 hover:bg-white/30 px-2 py-0.5 rounded font-bold text-xs">↩️ Undo</button>';}
  el.innerHTML=inner;
  document.body.appendChild(el);
  const ttl=opts.ttl||3200;
  setTimeout(function(){el.classList.remove('toast-in');el.classList.add('toast-out');setTimeout(function(){el.remove();},300);},ttl);
}

function extractYouTubeId(url){
  if(!url)return null;url=String(url).trim();
  let m=url.match(/youtube(?:-nocookie)?\.com\/embed\/([A-Za-z0-9_-]{11})/);if(m)return m[1];
  m=url.match(/[?&]v=([A-Za-z0-9_-]{11})/);if(m)return m[1];
  m=url.match(/youtu\.be\/([A-Za-z0-9_-]{11})/);if(m)return m[1];
  m=url.match(/youtube\.com\/shorts\/([A-Za-z0-9_-]{11})/);if(m)return m[1];
  m=url.match(/youtube\.com\/live\/([A-Za-z0-9_-]{11})/);if(m)return m[1];
  if(/^[A-Za-z0-9_-]{11}$/.test(url))return url;
  return null;
}

function compressImage(file){
  return new Promise(function(resolve,reject){
    if(!file||!file.type||file.type.indexOf('image/')!==0)return reject(new Error('File bukan gambar'));
    if(file.size>MAX_INPUT_IMAGE_SIZE)return reject(new Error('File terlalu besar ('+Math.round(file.size/1024/1024)+'MB). Maks '+Math.round(MAX_INPUT_IMAGE_SIZE/1024/1024)+'MB: '+file.name));
    const reader=new FileReader();
    reader.onload=function(e){
      const img=new Image();
      img.onload=function(){
        try{
          let w=img.width,h=img.height;
          if(w>IMAGE_MAX_DIMENSION||h>IMAGE_MAX_DIMENSION){
            if(w>h){h=Math.round(h*IMAGE_MAX_DIMENSION/w);w=IMAGE_MAX_DIMENSION;}
            else{w=Math.round(w*IMAGE_MAX_DIMENSION/h);h=IMAGE_MAX_DIMENSION;}
          }
          const canvas=document.createElement('canvas');
          canvas.width=w;canvas.height=h;
          const ctx=canvas.getContext('2d');
          ctx.fillStyle='#ffffff';ctx.fillRect(0,0,w,h);
          ctx.drawImage(img,0,0,w,h);
          const dataUrl=canvas.toDataURL('image/jpeg',IMAGE_QUALITY);
          const base64=dataUrl.split(',')[1];
          const estimatedSize=Math.round(base64.length*.75);
          if(estimatedSize>MAX_OUTPUT_IMAGE_SIZE)return reject(new Error('Gambar masih terlalu besar ('+Math.round(estimatedSize/1024/1024)+'MB): '+file.name));
          const newName=(file.name||'image').replace(/\.[^.]+$/,'')+'_'+Date.now()+'.jpg';
          resolve({base64:base64,mimeType:'image/jpeg',name:newName,dataUrl:dataUrl,size:estimatedSize});
        }catch(err){reject(err);}
      };
      img.onerror=function(){reject(new Error('Gagal membaca gambar'));};
      img.src=e.target.result;
    };
    reader.onerror=function(){reject(new Error('Gagal membaca file'));};
    reader.readAsDataURL(file);
  });
}

async function api(fnName){
  const args=Array.prototype.slice.call(arguments,1);
  const payload={fn:fnName,args:[token()].concat(args)};
  try{
    const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),redirect:'follow'});
    if(!res.ok)throw new Error('HTTP error '+res.status);
    const json=await res.json();
    if(!json.ok){
      const msg=json.error||'Unknown error';
      if(msg.indexOf('Sesi habis')!==-1||msg.indexOf('Sesi tidak ditemukan')!==-1||msg.indexOf('Silakan login ulang')!==-1){
        resetStateToLoggedOut();showToast('Sesi habis. Silakan login ulang.','warn');render();
        return Promise.reject(new Error(msg));
      }
      throw new Error(msg);
    }
    return json.data;
  }catch(err){throw new Error(err.message||String(err));}
}
async function apiLogin(fnName){
  const args=Array.prototype.slice.call(arguments,1);
  const payload={fn:fnName,args:args};
  try{
    const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),redirect:'follow'});
    if(!res.ok)throw new Error('HTTP error '+res.status);
    const json=await res.json();
    if(!json.ok)throw new Error(json.error||'Unknown error');
    return json.data;
  }catch(err){throw new Error(err.message||String(err));}
}

      case 'show-preview-poin':showPreviewPoinModal();break;
      case 'close-preview-poin':S.showPreviewPoin=false;render();break;
      case 'confirm-preview-poin':closeAndSubmit();break;
      case 'set-sort':S.studentSort=d.sort;render();break;
      case 'set-group':S.studentGroup=d.group;render();break;
      case 'do-undo':doUndo();break;
      case 'dismiss-undo':S.lastUndo=null;render();break;
    }
  }catch(err){console.error('Action error:',action,err);showToast('Terjadi kesalahan: '+err.message,'error');}
}, true);
document.addEventListener('keydown',function(e){

    if(S.drawerOpen){S.drawerOpen=false;render();e.preventDefault();}

async function submitAturanMulti(e){
  if(e&&e.preventDefault)e.preventDefault();
  if(!S.selectedStudents.length)return showToast('Pilih minimal 1 santri!','warn');
  const ruleIds=Object.keys(S.selectedRules);
  if(ruleIds.length===0)return showToast('Centang minimal 1 aktivitas!','warn');
  const rulesList=ruleIds.map(function(id){return{ruleId:parseInt(id,10),multiplier:S.selectedRules[id]||1};});
  const totalPts=calculateTotalPoints();
  const ruleNames=ruleIds.map(function(id){const r=S.rules.find(function(x){return x.id===parseInt(id,10);});return r?r.name:'';});
  let duplicateCount=0;
  S.selectedStudents.forEach(function(sid){const poin=S.poinHariIni[sid];if(!poin)return;const hasDup=poin.activities.some(function(a){return ruleNames.some(function(rn){return rn&&a.name.toLowerCase().indexOf(rn.toLowerCase())!==-1;});});if(hasDup)duplicateCount++;});
  let msg='Terapkan '+ruleIds.length+' aktivitas ke '+S.selectedStudents.length+' santri?\n\nTotal: '+(totalPts>0?'+':'')+totalPts+' poin per santri.';
  if(duplicateCount>0)msg+='\n\n⚠️ '+duplicateCount+' santri kemungkinan sudah dapat poin ini hari ini.';
  if(!confirm(msg))return;
  S.submitting=true;render();
  try{
    const idsCopy=S.selectedStudents.slice();
    const res=await api('savePointsMulti',idsCopy,rulesList);
    playDing();playConfetti();
    S.lastUndo={ids:idsCopy,points:res.totalPoints,label:'Beri poin '+res.totalPoints,expiresAt:Date.now()+60000};
    addAksi('+ '+res.totalPoints+' poin ke '+res.updated+' santri',res.updated,res.totalPoints);
    showToast('✅ '+res.updated+' santri diperbarui (+'+res.totalPoints+' poin)','success',{undo:true,ttl:8000});
    S.selectedStudents=[];S.selectedRules={};
    await loadData();await loadPoinHariIni();
  }catch(err){showToast('Gagal: '+err.message,'error');}
  S.submitting=false;render();
}

async function beriPoinHadir(){
  const ruleKehadiran=S.rules.find(function(r){return r.name.toLowerCase().indexOf('kehadiran')!==-1;});
  const ruleId=S.bulkRuleId?parseInt(S.bulkRuleId,10):(ruleKehadiran?ruleKehadiran.id:(S.rules[0]?S.rules[0].id:null));
  if(!ruleId)return showToast('Tidak ada aturan poin!','warn');
  const rule=S.rules.find(function(r){return r.id===ruleId;});
  const ruleName=rule?rule.name:'Poin';
  S.submitting=true;render();
  try{
    const hadirIds=await api('getHadirHariIni',S.absenTanggal);
    if(!hadirIds.length){S.submitting=false;render();return showToast('Belum ada santri hadir.','warn');}
    const duplicateIds=[];
    const eligibleIds=hadirIds.filter(function(id){
      const poin=S.poinHariIni[id];
      if(!poin)return true;
      const hasDup=poin.activities.some(function(a){return a.name.toLowerCase().indexOf(ruleName.toLowerCase())!==-1;});
      if(hasDup){duplicateIds.push(id);return false;}
      return true;
    });
    if(eligibleIds.length===0){S.submitting=false;render();return showToast('⚠️ Semua santri HADIR sudah dapat poin "'+ruleName+'" hari ini.','warn');}
    let confirmMsg='Beri poin "'+ruleName+'" ke '+eligibleIds.length+' santri HADIR?';
    if(duplicateIds.length>0)confirmMsg+='\n\n⚠️ '+duplicateIds.length+' santri dilewati karena sudah dapat poin ini.';
    if(!confirm(confirmMsg)){S.submitting=false;render();return;}
    const res=await api('savePointsMulti',eligibleIds,[{ruleId:ruleId,multiplier:1}]);
    playDing();playConfetti();
    S.lastUndo={ids:eligibleIds,points:res.totalPoints,label:'Poin hadir',expiresAt:Date.now()+60000};
    addAksi('+ '+res.totalPoints+' poin ke '+res.updated+' santri',res.updated,res.totalPoints);
    let msg='✅ '+res.updated+' santri +'+res.totalPoints+' poin';
    if(duplicateIds.length>0)msg+=' · '+duplicateIds.length+' dilewati';
    showToast(msg,'success',{undo:true,ttl:8000});
    await loadPoinHariIni();await loadData();
  }catch(err){showToast('Gagal: '+err.message,'error');}
  S.submitting=false;render();
}

function openEditMateri(id){const m=S.materials.find(function(x){return x.id===id;});if(m){S.editingMateri={id:m.id,title:m.title,type:m.type,content:m.content,desc:m.desc||'',images:(m.images||[]).slice()};S.uploadingImages=false;S.uploadProgress='';}render();}

function setMateriType(t){if(S.editingMateri){S.editingMateri.type=t;render();}}
async function handleImageSelect(event){
  const files=Array.from(event.target.files||[]);
  if(event.target.value!==undefined)try{event.target.value='';}catch(e){}
  if(!files.length||!S.editingMateri)return;
  const currentCount=(S.editingMateri.images||[]).length;
  const maxNew=Math.max(0,MAX_IMAGES_PER_UPLOAD-currentCount);
  if(maxNew===0)return showToast('Sudah mencapai batas '+MAX_IMAGES_PER_UPLOAD+' gambar','warn');
  const toProcess=files.slice(0,maxNew);
  if(files.length>maxNew)showToast('Hanya '+maxNew+' file pertama diproses','warn');
  S.uploadingImages=true;S.uploadProgress='Memeriksa & mengompres '+toProcess.length+' gambar...';render();
  const compressed=[];let totalBytes=0;const failures=[];
  for(let i=0;i<toProcess.length;i++){
    try{
      S.uploadProgress='Kompres '+(i+1)+'/'+toProcess.length+'...';render();
      const result=await compressImage(toProcess[i]);
      if(totalBytes+result.size>MAX_IMAGE_TOTAL_BYTES){failures.push(toProcess[i].name+' (total melebihi)');continue;}
      totalBytes+=result.size;compressed.push(result);
    }catch(err){failures.push(toProcess[i].name+' — '+err.message);}
  }
  if(failures.length)showToast('⚠️ '+failures.length+' file dilewati','warn');
  if(!compressed.length){S.uploadingImages=false;S.uploadProgress='';render();return showToast('Tidak ada gambar valid','error');}
  S.uploadProgress='Mengunggah '+compressed.length+' gambar...';render();
  try{
    const payload=compressed.map(function(c){return{name:c.name,base64:c.base64,mimeType:c.mimeType};});
    const res=await api('uploadMultipleImages',payload);
    if(res.images&&res.images.length)S.editingMateri.images=(S.editingMateri.images||[]).concat(res.images);
    playDing();showToast('✅ '+(res.uploaded||0)+' gambar berhasil','success');
    if(res.failed&&res.failed>0)showToast('⚠️ '+res.failed+' gambar gagal','warn');
    if(S.editingMateri.type!=='image')S.editingMateri.type='image';
  }catch(err){showToast('Gagal upload: '+err.message,'error');}
  S.uploadingImages=false;S.uploadProgress='';render();
}
async function removeImageFromEditing(idx){if(!S.editingMateri||!S.editingMateri.images)return;const img=S.editingMateri.images[idx];if(!img)return;if(!confirm('Hapus gambar ini?'))return;S.editingMateri.images.splice(idx,1);S.editingMateri._deletedImages=S.editingMateri._deletedImages||[];if(img.fileId)S.editingMateri._deletedImages.push(img.fileId);render();}
function moveImage(idx,direction){if(!S.editingMateri||!S.editingMateri.images)return;const arr=S.editingMateri.images;const target=idx+direction;if(target<0||target>=arr.length)return;const tmp=arr[idx];arr[idx]=arr[target];arr[target]=tmp;render();}
async function saveMateri(e){
  e.preventDefault();const ed=S.editingMateri;if(!ed)return;
  if(ed.type==='image'&&(!ed.images||ed.images.length===0)&&!ed.content)return showToast('Tambahkan minimal 1 gambar!','warn');
  S.submitting=true;render();
  try{
    const payload={title:ed.title,type:ed.type,content:ed.content||'',desc:ed.desc||'',images:ed.images||[]};
    if(ed.id)await api('updateMateri',ed.id,payload);else await api('addMateri',payload);
    if(ed._deletedImages&&ed._deletedImages.length){for(let k=0;k<ed._deletedImages.length;k++){try{await api('deleteImageFromDrive',ed._deletedImages[k]);}catch(e){}}}
    S.editingMateri=null;await loadData();showToast('Materi tersimpan','success');
  }catch(err){showToast('Gagal: '+err.message,'error');}
  S.submitting=false;render();
}

function closeQRCard(){S.printStudent=null;render();}
async function startScanner(){
  if(S.scannerInstance)return;
  if(typeof Html5Qrcode==='undefined')return showToast('Library QR belum siap','error');
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return showToast('Browser tidak mendukung kamera','error');
  if(window.location.protocol!=='https:'&&window.location.hostname!=='localhost'&&window.location.hostname!=='127.0.0.1')return showToast('Kamera butuh HTTPS','error');
  S.scannerActive=true;S.scanCooldown={};render();
  try{
    await new Promise(function(r){setTimeout(r,400);});
    const html5QrCode=new Html5Qrcode("qr-reader");
    S.scannerInstance=html5QrCode;
    await html5QrCode.start({facingMode:"environment"},{fps:10,qrbox:250},function(decodedText){
      const sid=parseInt(decodedText,10);
      const now=Date.now();
      if(S.scanCooldown[sid]&&(now-S.scanCooldown[sid])<3000)return;
      S.scanCooldown[sid]=now;
      const student=S.students.find(function(s){return s.id===sid;});
      if(!student){showToast('QR tidak dikenal','error');return;}
      playDing();
      api('scanQRAttendance',sid).then(function(res){
        if(res.sudahAbsen)showToast('⚠️ '+res.studentName+' sudah absen','warn');
        else{playConfetti();showToast('✅ '+res.studentName+' HADIR +'+res.poinDitambah,'success');}
        loadData();loadPoinHariIni();
      }).catch(function(err){showToast('Gagal: '+err.message,'error');});
    },function(errorMessage){});
  }catch(err){
    const msg=(err&&err.message)?err.message:'Izin kamera ditolak';
    showToast('Kamera gagal: '+msg,'error');
    try{if(S.scannerInstance){try{await S.scannerInstance.stop();}catch(e){}try{S.scannerInstance.clear();}catch(e){}}}catch(e){}
    S.scannerInstance=null;S.scannerActive=false;render();
  }
}
async function stopScanner(){try{if(S.scannerInstance){await S.scannerInstance.stop();S.scannerInstance.clear();S.scannerInstance=null;}}catch(e){}S.scannerActive=false;render();}

// =================================================================
// RENDER MAIN (with scroll preservation)
// =================================================================
function render(opts){
  opts=opts||{};
  const preserveScroll=opts.preserveScroll!==false;
  const activeEl=document.activeElement;
  const activeId=activeEl&&activeEl.id?activeEl.id:null;
  let selStart=null,selEnd=null;
  try{
    if(activeEl&&(activeEl.tagName==='INPUT'||activeEl.tagName==='TEXTAREA'||activeEl.tagName==='SELECT')){
      if(activeEl.selectionStart!==undefined){selStart=activeEl.selectionStart;selEnd=activeEl.selectionEnd;}
    }
  }catch(e){}
  const scrollY=preserveScroll?(window.scrollY||window.pageYOffset||0):0;
  const app=document.getElementById('app');

  if(S.loading){
    app.innerHTML='<div class="min-h-screen flex items-center justify-center" style="background:linear-gradient(135deg,#fef3c7,#fce7f3,#e0e7ff);">'+
      '<div class="bg-white rounded-3xl shadow-2xl p-12 text-center border-4 border-yellow-300">'+
      '<div class="text-6xl mb-3 spin">&#9881;</div>'+
      '<p class="text-gray-600 font-bold text-lg">Memuat...</p></div></div>';
    return;
  }
  if(S.error){
    app.innerHTML='<div class="min-h-screen bg-red-50 flex items-center justify-center p-4">'+
      '<div class="bg-white rounded-3xl shadow-2xl p-8 max-w-md text-center border-4 border-red-200">'+
      '<div class="text-6xl mb-4">⚠</div>'+
      '<h2 class="text-2xl font-bold text-red-700 mb-2">Ups, ada masalah</h2>'+
      '<p class="text-gray-600 mb-4 text-sm">'+esc(S.error)+'</p>'+
      '<button data-action="retry" class="btn-kid bg-blue-500 text-white font-bold px-6 py-3">Coba Lagi</button></div></div>';
    return;
  }
  if(!S.user){app.innerHTML=renderLogin();restoreFocus(activeId,selStart,selEnd);return;}
  if(S.mustChangePin){app.innerHTML=renderForcePinChange();restoreFocus(activeId,selStart,selEnd);return;}

  app.innerHTML=
    renderNav()+
    '<main style="padding-bottom:120px;">'+
      '<div class="max-w-3xl mx-auto px-3">'+renderView()+'</div>'+
    '</main>'+
    renderStickyActionBar()+
    renderLightbox()+
    renderPreviewPoinModal()+
    renderShortcutHelp();

  restoreFocus(activeId,selStart,selEnd);
  if(preserveScroll&&scrollY>0){requestAnimationFrame(function(){window.scrollTo(0,scrollY);});}
}
async function retry(){S.loading=true;S.error='';render();await loadData();S.loading=false;render();}

function renderStickyActionBar(){
  if(!S.user||S.user.role!=='admin')return '';

// =================================================================
// PREVIEW POIN MODAL
// =================================================================
function renderPreviewPoinModal(){
  if(!S.showPreviewPoin)return '';
  const ruleIds=Object.keys(S.selectedRules);
  const totalPts=calculateTotalPoints();
  const selectedStu=S.selectedStudents.map(function(id){return S.students.find(function(s){return s.id===id;});}).filter(Boolean);
  const ruleNames=ruleIds.map(function(id){const r=S.rules.find(function(x){return x.id===parseInt(id,10);});return r?(r.name+' ('+(r.points>0?'+':'')+r.points+')'):'';}).filter(Boolean);
  const duplicateList=[];
  selectedStu.forEach(function(s){
    const poin=S.poinHariIni[s.id];if(!poin)return;
    const dup=poin.activities.filter(function(a){return ruleNames.some(function(rn){return a.name.toLowerCase().indexOf(rn.split(' (')[0].toLowerCase())!==-1;});});
    if(dup.length)duplicateList.push({name:s.name,dup:dup.map(function(d){return d.name;}).join(', ')});
  });
  let rows=selectedStu.map(function(s){
    const after=(s.points||0)+totalPts;
    return '<tr class="border-b border-gray-100"><td class="p-2 font-bold text-xs">'+esc(s.name)+'</td><td class="p-2 text-[10px] text-gray-500">'+esc(s.kelas)+'</td><td class="p-2 text-right text-xs"><span class="text-gray-500">'+s.points+'</span> <span class="text-gray-400">→</span> <span class="font-bold '+(totalPts>0?'text-green-600':'text-red-600')+'">'+after+'</span></td></tr>';
  }).join('');
  const warnHtml=duplicateList.length>0?'<div class="bg-amber-50 border-2 border-amber-300 rounded-xl p-2 mb-2 text-[11px] text-amber-800">'+
    '<b>⚠️ '+duplicateList.length+' santri mungkin sudah dapat poin ini:</b>'+
    '<div class="mt-1 max-h-20 overflow-y-auto">'+duplicateList.map(function(d){return '• '+esc(d.name);}).join('<br>')+'</div></div>':'';
  return '<div class="fixed inset-0 bg-black bg-opacity-70 flex items-end sm:items-center justify-center z-[9998] p-0 sm:p-4" data-action="close-preview-poin">'+
    '<div class="bg-white p-4 sm:p-6 w-full max-w-lg max-h-[85vh] overflow-y-auto slide-up sm:fade-in" style="border-radius:24px 24px 0 0;border-top:4px solid #3b82f6;" onclick="event.stopPropagation()">'+
    '<div class="handle mx-auto" style="width:40px;height:4px;background:#d1d5db;border-radius:2px;margin-bottom:12px;"></div>'+
    '<div class="flex justify-between items-center mb-3"><h3 class="font-bold text-lg">📋 Konfirmasi</h3>'+
    '<button data-action="close-preview-poin" class="text-gray-400 text-2xl">&times;</button></div>'+
    '<div class="bg-gradient-to-r from-blue-50 to-indigo-50 rounded-xl p-3 mb-2">'+
    '<div class="text-[10px] font-bold text-gray-600 mb-1">AKTIVITAS ('+ruleIds.length+'):</div>'+
    '<div class="flex flex-wrap gap-1">'+ruleNames.map(function(n){return '<span class="bg-white text-blue-700 text-[10px] font-bold px-2 py-0.5 rounded-full border border-blue-200">'+esc(n)+'</span>';}).join('')+'</div>'+
    '<div class="mt-2 text-right font-black text-xl '+(totalPts>0?'text-green-600':'text-red-600')+'">'+(totalPts>0?'+':'')+totalPts+' per santri</div></div>'+
    warnHtml+
    '<div class="mb-2"><div class="text-[10px] font-bold text-gray-600 mb-1">SANTRI ('+selectedStu.length+'):</div>'+
    '<div class="max-h-40 overflow-y-auto border-2 border-gray-100 rounded-xl">'+
    '<table class="w-full text-xs"><thead class="bg-gray-50 sticky top-0"><tr><th class="text-left p-1.5 text-[10px]">Nama</th><th class="text-left p-1.5 text-[10px]">Kelas</th><th class="text-right p-1.5 text-[10px]">Poin</th></tr></thead>'+
    '<tbody>'+rows+'</tbody></table></div></div>'+
    '<div class="flex gap-2 pt-2">'+
    '<button data-action="close-preview-poin" class="btn-kid flex-1 bg-gray-200 text-gray-700 py-3 rounded-xl text-sm">Batal</button>'+
    '<button data-action="confirm-preview-poin" class="btn-kid flex-1 bg-gradient-to-r from-green-400 to-emerald-500 text-white py-3 rounded-xl text-sm font-black">✅ Terapkan</button>'+
    '</div></div></div>';
}

    inner+='<form onsubmit="event.preventDefault(); doLoginSantri();" class="space-y-3 text-left">'+

      '<button type="submit" '+(S.isLoggingIn?'disabled':'')+' class="btn-kid w-full bg-green-500 text-white py-3 disabled:opacity-60 font-bold">'+(S.isLoggingIn?'Memproses...':'Masuk')+'</button>'+

    '<div class="w-20 h-20 mx-auto rounded-full flex items-center justify-center mb-3 shadow-lg pulse-soft" style="background:linear-gradient(135deg,#fbbf24 0%,#fb923c 100%);border:4px solid #fef3c7;"><span style="font-size:40px;">📚</span></div>'+
    '<h1 class="text-2xl font-bold mb-1" style="background:linear-gradient(135deg,#f59e0b,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-weight:800;">TPQ Bani Saleh</h1>'+
    '<div class="inline-block bg-gradient-to-r from-pink-400 to-purple-400 text-white text-[10px] font-bold px-3 py-0.5 rounded-full mb-4">Cicadas</div>'+inner+

}

// =================================================================
// VIEW: KEHADIRAN INPUT (Compact)
// =================================================================
function viewKehadiranInput(){
  let list=S.students;
  if(S.absenKelasFilter)list=list.filter(function(s){return s.kelas===S.absenKelasFilter;});
  if(S.absenFilterPoin==='belum')list=list.filter(function(s){return!S.poinHariIni[s.id];});
  else if(S.absenFilterPoin==='sudah')list=list.filter(function(s){return!!S.poinHariIni[s.id];});
  if(S.absenFilterSetoran==='Iqra')list=list.filter(function(s){const g=S.setoranGroupMap[s.id];return g&&g.tipe==='Iqra';});
  else if(S.absenFilterSetoran==='Al-Quran')list=list.filter(function(s){const g=S.setoranGroupMap[s.id];return g&&g.tipe==='Al-Quran';});

  const kelasList=getKelasList();
  let kelasOpts='<option value="">Semua</option>';
  kelasList.forEach(function(k){kelasOpts+='<option value="'+esc(k)+'" '+(S.absenKelasFilter===k?'selected':'')+'>'+esc(k)+'</option>';});

  let statHadir=0,statSakit=0,statIzin=0,statAlfa=0;
  list.forEach(function(s){const st=S.absenData[s.id]?S.absenData[s.id].status:'Hadir';if(st==='Hadir')statHadir++;else if(st==='Sakit')statSakit++;else if(st==='Izin')statIzin++;else if(st==='Alfa')statAlfa++;});

  let sudahDapat=0,belumDapat=0;
  let allList=S.students;
  if(S.absenKelasFilter)allList=allList.filter(function(s){return s.kelas===S.absenKelasFilter;});
  allList.forEach(function(s){if(S.poinHariIni[s.id])sudahDapat++;else belumDapat++;});

  let rows='';
  if(list.length===0)rows='<p class="text-center text-gray-400 py-8 text-xs">Tidak ada santri</p>';
  else list.forEach(function(s){
    const item=S.absenData[s.id];
    const status=item?item.status:'Hadir';
    const sudah=S.poinHariIni[s.id];
    const group=S.setoranGroupMap[s.id];
    let statusBtns='';
    ['Hadir','Sakit','Izin','Alfa'].forEach(function(st){
      const activeCls=status===st?' active-'+st.toLowerCase():'';
      statusBtns+='<button data-action="set-absen-status" data-id="'+s.id+'" data-status="'+st+'" class="status-mini'+activeCls+'">'+STATUS_ICON[st]+'</button>';
    });
    const poinBadge=sudah?'<span class="text-[10px] font-bold bg-green-100 text-green-700 px-1.5 py-0.5 rounded">'+(sudah.total>0?'+':'')+sudah.total+'</span>':'';
    const groupTag=group?'<span class="text-[10px] font-bold '+(group.tipe==='Iqra'?'text-amber-600':'text-blue-600')+'">'+esc(group.detail)+'</span>':'';
    rows+='<div class="student-row '+(status==='Hadir'?'':'')+'">'+
      '<div class="info">'+
      '<div class="name">'+esc(s.name)+'</div>'+
      '<div class="meta">'+esc(s.kelas)+' · '+s.points+' poin '+groupTag+' '+poinBadge+'</div>'+
      '</div>'+
      '<div class="status-group">'+statusBtns+'</div>'+
      '</div>';
  });

  const ruleKehadiran=S.rules.find(function(r){return r.name.toLowerCase().indexOf('kehadiran')!==-1;});
  let ruleOpts='';
  S.rules.forEach(function(r){const selected=(S.bulkRuleId&&S.bulkRuleId==r.id)||(!S.bulkRuleId&&ruleKehadiran&&ruleKehadiran.id===r.id);ruleOpts+='<option value="'+r.id+'" '+(selected?'selected':'')+'>'+esc(r.name)+' ('+(r.points>0?'+':'')+r.points+')</option>';});

  const filterChips=[
    {k:'semua',l:'Semua',c:allList.length,clr:'bg-gray-100 text-gray-700'},
    {k:'belum',l:'⚠️ Belum',c:belumDapat,clr:'bg-amber-100 text-amber-700'},
    {k:'sudah',l:'✅ Sudah',c:sudahDapat,clr:'bg-green-100 text-green-700'}
  ].map(function(f){const active=S.absenFilterPoin===f.k;return '<button data-action="set-absen-filter-poin" data-filter="'+f.k+'" class="px-2.5 py-1 rounded-full text-[11px] font-bold '+f.clr+(active?' ring-2 ring-blue-400':'')+'">'+f.l+' '+f.c+'</button>';}).join('');

  const setoranChips=[
    {k:'semua',l:'📚 Semua'},
    {k:'Iqra',l:'🟡 Iqra'},
    {k:'Al-Quran',l:'🔵 Quran'}
  ].map(function(f){const active=S.absenFilterSetoran===f.k;return '<button data-action="set-absen-filter-setoran" data-filter="'+f.k+'" class="px-2.5 py-1 rounded-full text-[11px] font-bold '+(active?'bg-purple-500 text-white':'bg-gray-100 text-gray-600')+'">'+f.l+'</button>';}).join('');

  return '<div class="fade-in">'+
    '<div class="page-header">'+
    '<div class="icon-badge">⚡</div>'+
    '<div class="flex-1"><h1>Absen & Poin</h1>'+
    '<div class="sub">'+list.length+' santri · '+statHadir+'✅ '+statSakit+'🤒 '+statIzin+'📝 '+statAlfa+'❌</div></div></div>'+
    '<div class="flex gap-2 mb-3">'+
    '<input type="date" value="'+S.absenTanggal+'" onchange="S.absenTanggal=this.value;loadAbsenData().then(function(){return loadPoinHariIni();}).then(render);" class="flex-1 bg-white border-2 border-gray-200 rounded-xl px-3 py-2 text-xs font-bold" />'+
    '<select onchange="S.absenKelasFilter=this.value;render();" class="bg-white border-2 border-gray-200 rounded-xl px-3 py-2 text-xs font-bold">'+kelasOpts+'</select>'+
    '</div>'+
    '<details class="filter-details mb-3 bg-white rounded-2xl p-3 border-2 border-gray-100">'+
    '<summary>🔍 Filter Anti-Dobel & Setoran</summary>'+
    '<div class="pt-2 space-y-2">'+
    '<div class="flex flex-wrap gap-1.5">'+filterChips+'</div>'+
    '<div class="flex flex-wrap gap-1.5">'+setoranChips+'</div>'+
    '</div></details>'+
    '<div class="flex flex-wrap gap-1.5 mb-3">'+
    '<button data-action="set-all-absen" data-status="Hadir" class="px-3 py-1.5 bg-emerald-500 text-white rounded-full text-[11px] font-bold">✅ Semua Hadir</button>'+
    '<button data-action="set-all-absen" data-status="Sakit" class="px-3 py-1.5 bg-amber-500 text-white rounded-full text-[11px] font-bold">🤒 Sakit</button>'+
    '<button data-action="set-all-absen" data-status="Izin" class="px-3 py-1.5 bg-blue-500 text-white rounded-full text-[11px] font-bold">📝 Izin</button>'+
    '<button data-action="set-all-absen" data-status="Alfa" class="px-3 py-1.5 bg-red-500 text-white rounded-full text-[11px] font-bold">❌ Alfa</button>'+
    '</div>'+
    '<div class="space-y-1.5">'+rows+'</div>'+
    '<div class="sticky mt-4 flex gap-2 bg-white/95 backdrop-blur p-2 rounded-2xl shadow-lg border-2 border-amber-200" style="bottom:76px;">'+
    '<button data-action="submit-absen" '+(S.submitting?'disabled':'')+' class="flex-1 bg-gradient-to-r from-blue-400 to-blue-500 text-white py-3 rounded-xl text-sm font-black disabled:opacity-60">💾 Simpan</button>'+
    '<button data-action="beri-poin-hadir" '+(S.submitting?'disabled':'')+' class="flex-1 bg-gradient-to-r from-emerald-400 to-green-500 text-white py-3 rounded-xl text-sm font-black disabled:opacity-60">🎁 Beri Poin</button>'+
    '</div>'+
    '<details class="mt-3 bg-purple-50 rounded-2xl p-3 border-2 border-purple-100">'+
    '<summary class="text-[11px] font-bold text-purple-700 cursor-pointer">📌 Aturan poin bulk</summary>'+
    '<select onchange="S.bulkRuleId=this.value;render();" class="w-full mt-2 bg-white border-2 border-purple-200 rounded-xl px-3 py-2 text-xs font-medium">'+ruleOpts+'</select>'+
    '</details>'+
    '</div>';
}

// =================================================================
// VIEW: INPUT POIN (Sheet-based Compact)
// =================================================================
function viewAdminPoin(){
  let chipsHtml='';
  if(S.selectedStudents.length>0){
    const chipItems=S.selectedStudents.slice(0,8).map(function(id){
      const s=S.students.find(function(x){return x.id===id;});
      if(!s)return '';
      return '<span class="chip-santri">'+esc(s.name)+'<button data-action="remove-chip-santri" data-id="'+s.id+'">×</button></span>';
    }).join('');
    const extra=S.selectedStudents.length>8?'<span class="chip-santri bg-amber-100 text-amber-700 border-amber-300">+'+(S.selectedStudents.length-8)+'</span>':'';
    chipsHtml='<div class="bg-white rounded-2xl p-2 border-2 border-blue-100 mb-3">'+
      '<div class="flex items-center justify-between mb-1.5">'+
      '<span class="text-[11px] font-black text-blue-700">👥 TERPILIH ('+S.selectedStudents.length+')</span>'+
      '<button data-action="clear-student-selection" class="text-[10px] bg-red-100 text-red-700 px-2 py-0.5 rounded font-bold">Hapus</button>'+
      '</div>'+
      '<div class="flex flex-wrap gap-1">'+chipItems+extra+'</div></div>';
  }

  const selRules=Object.keys(S.selectedRules).map(function(id){
    const r=S.rules.find(function(x){return x.id===parseInt(id,10);});
    return r?{id:r.id,name:r.name,pts:r.points*(r.isMultiplier?(S.selectedRules[id]||1):1)}:null;
  }).filter(Boolean);
  const totalPts=selRules.reduce(function(a,r){return a+r.pts;},0);

  let actChips='';
  if(selRules.length>0){
    actChips='<div class="flex flex-wrap gap-1 mb-3">'+
      selRules.map(function(r){
        return '<span class="bg-blue-100 text-blue-700 text-[11px] font-bold px-2 py-0.5 rounded-full">'+esc(r.name)+' '+(r.pts>0?'+':'')+r.pts+'</span>';
      }).join('')+
      '<button data-action="clear-rule-selection" class="text-[10px] bg-red-100 text-red-700 px-2 py-0.5 rounded font-bold">Reset</button>'+
      '</div>';
  }

  const filtered=getFilteredStudentsSortedGrouped();
  let rows='';
  if(filtered.length===0)rows='<p class="text-center text-gray-400 py-8 text-xs">Tidak ada santri</p>';
  else filtered.forEach(function(s){
    const sel=S.selectedStudents.indexOf(s.id)!==-1;
    const sudah=S.poinHariIni[s.id];
    rows+='<div data-action="toggle-student" data-id="'+s.id+'" class="student-row '+(sel?'selected':'')+'">'+
      '<div class="check">'+(sel?'✓':'')+'</div>'+
      '<div class="info">'+
      '<div class="name">'+esc(s.name)+'</div>'+
      '<div class="meta">'+esc(s.kelas)+(sudah?' · <span class="text-green-600 font-bold">+'+sudah.total+' hr ini</span>':'')+'</div>'+
      '</div>'+
      '<div class="points '+(s.points<0?'neg':'pos')+'">'+s.points+'</div>'+
      '</div>';
  });

  let sheet='';
  if(S.poinSheetOpen){
    const posRules=S.rules.filter(function(r){return r.points>=0;}).sort(function(a,b){return a.points-b.points;});
    const negRules=S.rules.filter(function(r){return r.points<0;}).sort(function(a,b){return b.points-a.points;});
    function ruleItem(r){
      const isSel=S.selectedRules[r.id]!==undefined;
      return '<div data-action="toggle-rule" data-id="'+r.id+'" class="flex items-center justify-between p-3 rounded-2xl '+
        (isSel?(r.points>=0?'bg-green-100 border-2 border-green-400':'bg-red-100 border-2 border-red-400'):'bg-gray-50 border-2 border-gray-100')+' mb-1.5">'+
        '<div class="flex items-center gap-2">'+
        '<div class="rule-checkbox '+(isSel?'bg-blue-500 border-blue-500':'')+'">'+(isSel?'✓':'')+'</div>'+
        '<span class="font-bold text-sm">'+esc(r.name)+'</span>'+
        '</div>'+
        '<span class="font-black '+(r.points>=0?'text-green-600':'text-red-600')+'">'+(r.points>0?'+':'')+r.points+'</span>'+
        '</div>';
    }
    sheet='<div class="sheet-overlay" data-action="close-sheet"></div>'+
      '<div class="bottom-sheet" onclick="event.stopPropagation()">'+
      '<div class="handle"></div>'+
      '<div class="flex items-center justify-between mb-3">'+
      '<h3 class="font-black text-base">Pilih Aktivitas</h3>'+
      '<button data-action="close-sheet" class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-xl font-bold">×</button>'+
      '</div>'+
      (selRules.length>0?'<div class="bg-blue-50 rounded-2xl p-2 mb-3 text-center"><div class="text-[10px] font-bold text-gray-600">Total per santri</div><div class="text-2xl font-black '+(totalPts>0?'text-green-600':'text-red-600')+'">'+(totalPts>0?'+':'')+totalPts+'</div></div>':'')+
      '<div class="text-[10px] font-black text-green-700 mb-1">✅ REWARD</div>'+
      posRules.map(ruleItem).join('')+
      '<div class="text-[10px] font-black text-red-700 mb-1 mt-3">⚠️ HUKUMAN</div>'+
      negRules.map(ruleItem).join('')+
      '<button data-action="close-sheet" class="btn-kid w-full bg-blue-500 text-white py-3 mt-4 rounded-2xl font-black">Selesai</button>'+
      '</div>';
  }

  return '<div class="fade-in">'+
    '<div class="page-header">'+
    '<div class="icon-badge">🎯</div>'+
    '<div class="flex-1"><h1>Input Poin</h1>'+
    '<div class="sub">'+filtered.length+' santri · '+selRules.length+' aktivitas</div></div>'+
    '</div>'+
    chipsHtml+actChips+
    '<div class="flex gap-2 mb-3">'+
    '<input type="text" placeholder="Cari nama..." value="'+esc(S.searchTerm)+'" oninput="debouncedSearch(this.value)" class="flex-1 bg-white border-2 border-gray-200 rounded-xl px-3 py-2 text-xs" />'+
    '<select onchange="S.studentSort=this.value;render();" class="bg-white border-2 border-gray-200 rounded-xl px-2 py-2 text-xs font-bold">'+
    '<option value="name" '+(S.studentSort==='name'?'selected':'')+'>A-Z</option>'+
    '<option value="points" '+(S.studentSort==='points'?'selected':'')+'>Poin</option>'+
    '<option value="kelas" '+(S.studentSort==='kelas'?'selected':'')+'>Kelas</option>'+
    '</select></div>'+
'<div class="flex flex-wrap gap-1.5 mb-2">'+
'<span class="text-[10px] font-bold text-gray-500 self-center">Setoran:</span>'+
'<button data-action="set-poin-filter-setoran" data-filter="semua" class="px-2.5 py-1 rounded-full text-[11px] font-bold '+(S.poinFilterSetoran==='semua'?'bg-purple-500 text-white':'bg-gray-100 text-gray-600')+'">📚 Semua</button>'+
'<button data-action="set-poin-filter-setoran" data-filter="Iqra" class="px-2.5 py-1 rounded-full text-[11px] font-bold '+(S.poinFilterSetoran==='Iqra'?'bg-amber-500 text-white':'bg-gray-100 text-gray-600')+'">🟡 Iqra</button>'+
'<button data-action="set-poin-filter-setoran" data-filter="Al-Quran" class="px-2.5 py-1 rounded-full text-[11px] font-bold '+(S.poinFilterSetoran==='Al-Quran'?'bg-blue-500 text-white':'bg-gray-100 text-gray-600')+'">🔵 Al-Quran</button>'+
'</div>'+
'<div class="flex flex-wrap gap-1.5 mb-3">'+
'<button data-action="select-hadir-hari-ini" class="px-3 py-1.5 bg-emerald-100 text-emerald-700 rounded-full text-[11px] font-bold">✅ Hadir hari ini</button>'+
    '<button data-action="select-all-filtered" class="px-3 py-1.5 bg-amber-100 text-amber-700 rounded-full text-[11px] font-bold">☑️ Pilih semua</button>'+
    '</div>'+
    '<div class="space-y-1.5">'+rows+'</div>'+
    '<div class="sticky mt-4 flex gap-2 bg-white/95 backdrop-blur p-2 rounded-2xl shadow-lg border-2 border-blue-200" style="bottom:76px;">'+
    '<button data-action="open-sheet" class="flex-1 bg-blue-500 text-white py-3 rounded-xl text-sm font-black">🎯 Aktivitas ('+selRules.length+')</button>'+
    '<button data-action="show-preview-poin" '+(S.selectedStudents.length===0||selRules.length===0?'disabled':'')+' class="flex-1 bg-gradient-to-r from-green-400 to-emerald-500 text-white py-3 rounded-xl text-sm font-black disabled:opacity-40">✅ Terapkan</button>'+
    '</div>'+
    sheet+
    '</div>';
}

// =================================================================
// VIEW: ADMIN DASHBOARD (Minimal)
// =================================================================
function viewAdminDashboard(){
  const totalSantri=S.students.length;
  const totalPoin=S.students.reduce(function(a,s){return a+(s.points||0);},0);
  const sorted=S.students.slice().sort(function(a,b){return b.points-a.points;});
  const medals=['🥇','🥈','🥉'];
  let topList='';
  sorted.slice(0,5).forEach(function(s,i){
    const rank=i<3?medals[i]:'#'+(i+1);
    topList+='<div class="flex items-center justify-between py-2 border-b border-gray-100 last:border-0">'+
      '<div class="flex items-center gap-2 min-w-0">'+
      '<span class="text-base w-6 flex-shrink-0">'+rank+'</span>'+
      '<span class="font-bold text-sm truncate">'+esc(s.name)+'</span>'+
      '</div>'+
      '<span class="font-black text-blue-600 text-sm">'+s.points+'</span>'+
      '</div>';
  });
  return '<div class="fade-in">'+
    '<div class="page-header">'+
    '<div class="icon-badge">👋</div>'+
    '<div class="flex-1"><h1>Hai, '+esc((S.user.data.name||'Ustadzah').split(' ')[0])+'!</h1>'+
    '<div class="sub">'+totalSantri+' santri · '+totalPoin+' poin total</div></div></div>'+
    '<div class="grid grid-cols-2 gap-3 mb-4">'+
    '<button data-action="goto" data-view="kehadiran_input" class="bg-gradient-to-br from-emerald-400 to-green-500 text-white rounded-2xl p-4 text-left">'+
    '<div class="text-3xl mb-1">⚡</div>'+
    '<div class="font-black text-sm">Absen & Poin</div>'+
    '<div class="text-[10px] opacity-80">Paling sering dipakai</div></button>'+

// =================================================================
// VIEW: KELOLA POIN
// =================================================================
function viewAdminKelolaPoin(){
  const pos=S.rules.filter(function(r){return r.points>=0;}).sort(function(a,b){return a.points-b.points;});
  const neg=S.rules.filter(function(r){return r.points<0;}).sort(function(a,b){return b.points-a.points;});
  function ruleCard(r){
    const cls=r.points>=0?'bg-green-50 border-green-200':'bg-red-50 border-red-200';
    const pillCls=r.points>=0?'bg-green-500':'bg-red-500';
    const sign=r.points>0?'+':'';
    return '<div class="flex items-center justify-between '+cls+' rounded-xl px-3 py-2 border-2">'+
      '<div class="min-w-0 flex-1"><div class="font-bold text-gray-800 text-xs truncate">'+esc(r.name)+'</div>'+
      (r.isMultiplier?'<div class="text-[10px] text-orange-600 font-semibold">× bisa dikalikan</div>':'')+'</div>'+
      '<div class="flex items-center gap-1 flex-shrink-0"><span class="'+pillCls+' text-white font-bold px-2 py-0.5 rounded-full text-xs">'+sign+r.points+'</span>'+
      '<button data-action="edit-rule" data-id="'+r.id+'" class="bg-blue-100 text-blue-700 p-1.5 rounded-lg text-[10px] font-bold">✏</button>'+
      '<button data-action="delete-rule" data-id="'+r.id+'" data-name="'+esc(r.name)+'" class="bg-red-100 text-red-700 p-1.5 rounded-lg text-[10px] font-bold">🗑</button>'+
      '</div></div>';
  }
  let modal='';
  if(S.editingRule){
    const ed=S.editingRule;
    modal='<div class="fixed inset-0 bg-black bg-opacity-50 flex items-end sm:items-center justify-center z-50 p-0 sm:p-4">'+
      '<form onsubmit="saveRule(event)" class="bg-white p-5 w-full max-w-md shadow-2xl slide-up sm:fade-in" style="border-radius:24px 24px 0 0;border-top:4px solid #fbbf24;">'+
      '<div class="handle mx-auto" style="width:40px;height:4px;background:#d1d5db;border-radius:2px;margin-bottom:12px;"></div>'+
      '<h3 class="font-bold text-base mb-3">'+(ed.id?'Edit':'Tambah')+' Aturan</h3>'+
      '<div class="space-y-2">'+
      '<input id="ruleName" type="text" required value="'+esc(ed.name)+'" oninput="S.editingRule.name=this.value" class="w-full bg-yellow-50 border-2 border-yellow-200 rounded-xl px-3 py-2 text-sm" placeholder="Nama aktivitas" />'+
      '<input id="rulePoints" type="number" required value="'+ed.points+'" oninput="S.editingRule.points=this.value" class="w-full bg-yellow-50 border-2 border-yellow-200 rounded-xl px-3 py-2 text-sm font-bold" placeholder="Poin" />'+
      '<label class="flex items-center gap-2 bg-yellow-50 px-3 py-2 rounded-xl border-2 border-yellow-200">'+
      '<input type="checkbox" '+(ed.isMultiplier?'checked':'')+' onchange="S.editingRule.isMultiplier=this.checked" class="w-4 h-4 accent-amber-500" />'+
      '<span class="font-bold text-gray-700 text-xs">Bisa dikalikan</span></label>'+
      '<div class="flex gap-2 pt-1">'+
      '<button type="button" data-action="close-rule-modal" class="btn-kid flex-1 bg-gray-200 text-gray-700 py-2.5 rounded-xl text-sm">Batal</button>'+
      '<button type="submit" '+(S.submitting?'disabled':'')+' class="btn-kid flex-1 bg-blue-500 text-white py-2.5 rounded-xl text-sm disabled:opacity-60">Simpan</button>'+
      '</div></div></form></div>';
  }
  return '<div class="fade-in">'+
    '<div class="page-header">'+
    '<div class="icon-badge">🎨</div>'+
    '<div class="flex-1"><h1>Aturan Poin</h1><div class="sub">'+S.rules.length+' aturan</div></div>'+
    '<button data-action="open-add-rule" class="bg-blue-500 text-white px-3 py-2 rounded-xl text-xs font-bold">+ Tambah</button>'+
    '</div>'+modal+
    '<div class="space-y-3">'+
    '<div class="card-kid bg-white p-4"><h3 class="font-bold text-green-700 mb-2 flex items-center gap-2 text-sm">✅ Poin Reward ('+pos.length+')</h3>'+
    '<div class="space-y-1.5">'+(pos.map(ruleCard).join('')||'<p class="text-gray-400 text-xs text-center py-2">Kosong</p>')+'</div></div>'+
    '<div class="card-kid bg-white p-4"><h3 class="font-bold text-red-700 mb-2 flex items-center gap-2 text-sm">⚠ Poin Hukuman ('+neg.length+')</h3>'+
    '<div class="space-y-1.5">'+(neg.map(ruleCard).join('')||'<p class="text-gray-400 text-xs text-center py-2">Kosong</p>')+'</div></div>'+
    '</div></div>';
}

// VIEW: KELOLA MATERI (Admin)

function viewAdminKelolaMateri(){
  const TYPES=[{v:'text',l:'Teks',i:'📄'},{v:'image',l:'Gambar',i:'🖼️'},{v:'pdf',l:'PDF',i:'📕'},{v:'video',l:'Video',i:'🎥'},{v:'audio',l:'Audio',i:'🎵'},{v:'link',l:'Link',i:'🔗'}];
  let cards='';
  if(S.materials.length===0)cards='<p class="text-gray-400 text-center py-6 col-span-full text-xs">Belum ada materi.</p>';
  else S.materials.forEach(function(m){
    const typeColors={text:'from-blue-100 to-cyan-100 border-blue-300',pdf:'from-red-100 to-orange-100 border-red-300',image:'from-purple-100 to-pink-100 border-purple-300',video:'from-rose-100 to-pink-100 border-rose-300',audio:'from-green-100 to-emerald-100 border-green-300',link:'from-cyan-100 to-blue-100 border-cyan-300'};
    const imgCount=(m.images&&m.images.length)?m.images.length:0;
    const thumb=imgCount>0?m.images[0].url:null;
    cards+='<div class="bg-gradient-to-br '+(typeColors[m.type]||'from-gray-100 to-gray-200 border-gray-300')+' rounded-2xl p-3 border-2">'+
      (thumb?'<div class="mb-2 rounded-xl overflow-hidden bg-white" style="height:90px;"><img src="'+esc(thumb)+'" style="width:100%;height:100%;object-fit:cover;" /></div>':'')+
      '<div class="flex items-center justify-between mb-1"><span class="text-[10px] font-black bg-white px-2 py-0.5 rounded-full uppercase">'+esc(m.type)+(imgCount>1?' · '+imgCount:'')+'</span>'+
      '<div class="flex gap-1">'+
      '<button data-action="edit-materi" data-id="'+m.id+'" class="bg-white p-1.5 rounded-lg text-blue-600 text-[10px]">✏</button>'+
      '<button data-action="delete-materi" data-id="'+m.id+'" data-title="'+esc(m.title)+'" class="bg-white p-1.5 rounded-lg text-red-600 text-[10px]">🗑</button>'+
      '</div></div>'+
      '<h3 class="font-bold text-gray-800 text-sm truncate">'+esc(m.title)+'</h3>'+
      (m.desc?'<p class="text-gray-600 text-[10px] truncate">'+esc(m.desc)+'</p>':'')+'</div>';
  });
  let modal='';
  if(S.editingMateri){
    const ed=S.editingMateri;
    let typeBtns=TYPES.map(function(t){const active=ed.type===t.v;return '<button type="button" data-action="set-materi-type" data-type="'+t.v+'" class="px-2 py-1.5 rounded-lg font-bold text-[10px] '+(active?'bg-purple-500 text-white':'bg-gray-100 text-gray-600')+'">'+t.i+'</button>';}).join('');
    let imageSection='';
    if(ed.type==='image'){
      const imgs=ed.images||[];
      let grid='';
      imgs.forEach(function(img,idx){
        grid+='<div class="img-thumb">'+
          '<img src="'+esc(img.url)+'" />'+
          '<button type="button" data-action="remove-image-editing" data-idx="'+idx+'" class="remove-btn">×</button>'+
          '<div class="absolute bottom-1 left-1 flex gap-1">'+
          (idx>0?'<button type="button" data-action="move-image" data-idx="'+idx+'" data-dir="-1" class="w-5 h-5 rounded-full bg-white/90 text-gray-700 font-bold text-[10px]">‹</button>':'')+
          (idx<imgs.length-1?'<button type="button" data-action="move-image" data-idx="'+idx+'" data-dir="1" class="w-5 h-5 rounded-full bg-white/90 text-gray-700 font-bold text-[10px]">›</button>':'')+
          '</div></div>';
      });
      imageSection='<div class="space-y-2">'+
        '<div class="flex items-center justify-between"><label class="text-xs font-bold">📸 Gambar ('+imgs.length+'/'+MAX_IMAGES_PER_UPLOAD+')</label>'+
        (imgs.length>0?'<button type="button" data-action="clear-materi-images" class="text-[10px] bg-red-100 text-red-700 px-2 py-0.5 rounded font-bold">Kosongkan</button>':'')+'</div>'+
        (S.uploadingImages?'<div class="bg-purple-50 border-2 border-purple-200 rounded-xl p-3 text-center"><div class="text-3xl spin">&#9881;</div><p class="text-[10px] font-bold text-purple-700 mt-1">'+esc(S.uploadProgress||'Memproses...')+'</p></div>'
        :'<label class="upload-zone'+(imgs.length>=MAX_IMAGES_PER_UPLOAD?' disabled':'')+'"><input type="file" accept="image/*" multiple onchange="handleImageSelect(event)" class="hidden" '+(imgs.length>=MAX_IMAGES_PER_UPLOAD?'disabled':'')+' />'+
        '<div class="text-3xl mb-1">📤</div><div class="font-bold text-purple-700 text-xs">Pilih Gambar</div>'+
        '<div class="text-[10px] text-purple-500">Maks '+MAX_IMAGES_PER_UPLOAD+' · Auto kompres</div></label>')+
        (imgs.length>0?'<div class="grid grid-cols-3 gap-1.5 max-h-48 overflow-y-auto">'+grid+'</div>':'')+
        '<input type="text" value="'+esc(ed.content)+'" oninput="S.editingMateri.content=this.value" class="w-full bg-yellow-50 border-2 border-yellow-200 rounded-xl px-3 py-2 text-xs" placeholder="Atau URL gambar" />'+
        '</div>';
    }else{
      const ph=ed.type==='pdf'?'URL PDF':ed.type==='video'?'URL YouTube':ed.type==='audio'?'URL audio':ed.type==='link'?'URL tujuan':'Tulis materi...';
      imageSection=ed.type==='text'?'<textarea rows="4" oninput="S.editingMateri.content=this.value" class="w-full bg-yellow-50 border-2 border-yellow-200 rounded-xl px-3 py-2 resize-none text-sm" placeholder="'+ph+'">'+esc(ed.content)+'</textarea>'
      :'<input type="text" value="'+esc(ed.content)+'" oninput="S.editingMateri.content=this.value" class="w-full bg-yellow-50 border-2 border-yellow-200 rounded-xl px-3 py-2 text-sm" placeholder="'+ph+'" />';
    }
    modal='<div class="fixed inset-0 bg-black bg-opacity-50 flex items-end sm:items-center justify-center z-50 p-0 sm:p-4 overflow-y-auto">'+
      '<form onsubmit="saveMateri(event)" class="bg-white p-4 w-full max-w-lg shadow-2xl slide-up sm:fade-in my-0 sm:my-8 max-h-[90vh] overflow-y-auto" style="border-radius:24px 24px 0 0;border-top:4px solid #a78bfa;">'+
      '<div class="handle mx-auto" style="width:40px;height:4px;background:#d1d5db;border-radius:2px;margin-bottom:12px;"></div>'+
      '<h3 class="font-bold text-base mb-3">'+(ed.id?'Edit':'Tambah')+' Materi</h3>'+
      '<div class="space-y-2">'+
      '<input type="text" required value="'+esc(ed.title)+'" oninput="S.editingMateri.title=this.value" class="w-full bg-yellow-50 border-2 border-yellow-200 rounded-xl px-3 py-2 text-sm" placeholder="Judul" />'+
      '<div class="flex gap-1 flex-wrap">'+typeBtns+'</div>'+
      imageSection+
      '<input type="text" value="'+esc(ed.desc)+'" oninput="S.editingMateri.desc=this.value" class="w-full bg-yellow-50 border-2 border-yellow-200 rounded-xl px-3 py-2 text-sm" placeholder="Deskripsi (opsional)" />'+
      '<div class="flex gap-2 pt-1"><button type="button" data-action="close-materi-modal" class="btn-kid flex-1 bg-gray-200 py-2.5 rounded-xl text-sm">Batal</button>'+
      '<button type="submit" '+(S.submitting||S.uploadingImages?'disabled':'')+' class="btn-kid flex-1 bg-purple-500 text-white py-2.5 rounded-xl text-sm disabled:opacity-60">Simpan</button></div>'+
      '</div></form></div>';
  }
  return '<div class="fade-in">'+
    '<div class="page-header">'+
    '<div class="icon-badge">📚</div>'+
    '<div class="flex-1"><h1>Kelola Materi</h1><div class="sub">'+S.materials.length+' materi</div></div>'+

    '</div>'+modal+
    '<div class="grid grid-cols-2 gap-3">'+cards+'</div></div>';
}

  const typeIcons={text:'📄',pdf:'📕',image:'🖼',video:'🎥',audio:'🎵',link:'🔗'};
  let cards='';
  if(S.materials.length===0)cards='<p class="text-gray-400 text-center py-6 col-span-full text-xs">Belum ada materi.</p>';
  else S.materials.forEach(function(m){
    const imgCount=(m.images&&m.images.length)?m.images.length:0;
    const thumb=imgCount>0?m.images[0].url:null;
    cards+='<div class="bg-gradient-to-br '+(typeColors[m.type]||'from-gray-100 to-gray-200 border-gray-300')+' rounded-2xl p-3 border-2 flex flex-col">'+
      (thumb?'<div class="rounded-xl overflow-hidden bg-white mb-2" style="height:90px;"><img src="'+esc(thumb)+'" style="width:100%;height:100%;object-fit:cover;" /></div>':'<div class="text-3xl mb-2">'+(typeIcons[m.type]||'📄')+'</div>')+
      '<h3 class="font-bold text-sm text-gray-800 truncate">'+esc(m.title)+'</h3>'+
      (imgCount>1?'<div class="text-[10px] text-purple-600 font-bold">📸 '+imgCount+'</div>':'')+
      '<button data-action="preview-materi" data-id="'+m.id+'" class="btn-kid w-full mt-auto bg-blue-500 text-white py-2 text-xs mt-2 rounded-xl">Buka</button></div>';
  });
  let preview='';
  if(S.previewMateri){
    const m=S.previewMateri;
    let body='';
    if(m.type==='image'){
      const imgs=m.images||[];
      if(imgs.length>0){
        let thumbs='';
        imgs.forEach(function(img,idx){
          const imgsJson=JSON.stringify(imgs).replace(/"/g,'&quot;');
          thumbs+='<div data-action="open-lightbox" data-images="'+imgsJson+'" data-index="'+idx+'" class="cursor-pointer rounded-xl overflow-hidden bg-gray-100" style="width:140px;height:140px;">'+
            '<img src="'+esc(img.url)+'" style="width:100%;height:100%;object-fit:cover;" /></div>';
        });
        body='<div class="gallery-scroll">'+thumbs+'</div>'+
          '<div class="text-center text-[10px] text-gray-500 mt-2">Klik untuk perbesar · '+imgs.length+' gambar</div>';
      }else if(m.content){body='<img src="'+esc(m.content)+'" class="w-full rounded-xl max-h-80 object-contain" />';}
      else{body='<p class="text-gray-400 text-center py-6 text-xs">Belum ada gambar.</p>';}
    }
    else if(m.type==='video'){
      const ytId=extractYouTubeId(m.content);
      if(ytId)body='<div class="video-wrap"><iframe src="https://www.youtube-nocookie.com/embed/'+ytId+'?rel=0&modestbranding=1" allowfullscreen></iframe></div>';
      else body='<a href="'+esc(m.content)+'" target="_blank" class="text-blue-500 underline break-all text-xs">'+esc(m.content)+'</a>';
    }
    else if(m.type==='audio')body='<audio controls src="'+esc(m.content)+'" class="w-full"></audio>';
    else if(m.type==='pdf')body='<iframe src="'+esc(m.content)+'" class="w-full rounded-xl" style="height:400px;border:0;"></iframe>';
    else if(m.type==='link')body='<a href="'+esc(m.content)+'" target="_blank" class="text-blue-500 underline break-all text-xs">'+esc(m.content)+'</a>';
    else body='<p class="text-gray-700 whitespace-pre-line text-sm">'+esc(m.content)+'</p>';
    preview='<div class="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-50 p-4" data-action="close-preview">'+
      '<div class="bg-white p-4 max-w-2xl w-full max-h-[90vh] overflow-y-auto" style="border-radius:20px;border:3px solid #60a5fa;" onclick="event.stopPropagation()">'+
      '<div class="flex justify-between items-center mb-3"><h3 class="font-bold text-base">'+esc(m.title)+'</h3>'+
      '<button data-action="close-preview" class="text-gray-400 text-2xl">&times;</button></div>'+body+'</div></div>';
  }
  return '<div class="fade-in">'+
    '<div class="page-header">'+
    '<div class="icon-badge">📚</div>'+
    '<div class="flex-1"><h1>Materi</h1><div class="sub">Yuk belajar!</div></div></div>'+
    '<div class="grid grid-cols-2 gap-3">'+cards+'</div>'+preview+'</div>';
}

// VIEW: JADWAL
// =================================================================
function viewJadwal(){
  const kelasList=getKelasList();
  let filterOpts='<option value="">Semua</option>';
  kelasList.forEach(function(k){filterOpts+='<option value="'+esc(k)+'" '+(S.jadwalKelas===k?'selected':'')+'>'+esc(k)+'</option>';});
  let list=S.jadwalList;
  if(S.jadwalKelas)list=list.filter(function(j){return j.kelas===S.jadwalKelas;});
  const grouped={};
  HARI.forEach(function(h){grouped[h]=[];});
  list.forEach(function(j){if(grouped[j.hari])grouped[j.hari].push(j);});
  let content='';
  HARI.forEach(function(h){
    if(grouped[h].length===0)return;
    content+='<div class="mb-3"><div class="bg-gradient-to-r from-cyan-400 to-blue-500 text-white px-3 py-1.5 rounded-t-xl font-bold text-xs">'+h+'</div>'+
      '<div class="bg-white border-2 border-cyan-200 rounded-b-xl divide-y divide-cyan-100">';
    grouped[h].forEach(function(j){
      content+='<div class="p-2 flex items-center justify-between gap-2">'+
        '<div class="flex-1 min-w-0"><div class="font-bold text-gray-800 text-xs truncate">'+esc(j.mapel)+'</div>'+
        '<div class="text-[10px] text-gray-500">'+esc(j.jam)+' · '+esc(j.guru)+'</div></div>'+
        (S.user.role==='admin'?'<div class="flex gap-1 flex-shrink-0">'+
          '<button data-action="edit-jadwal" data-id="'+j.id+'" class="bg-blue-100 text-blue-700 p-1.5 rounded-lg text-[10px]">✏</button>'+
          '<button data-action="delete-jadwal" data-id="'+j.id+'" class="bg-red-100 text-red-700 p-1.5 rounded-lg text-[10px]">🗑</button>'+
          '</div>':'')+'</div>';
    });
    content+='</div></div>';
  });
  if(content==='')content='<p class="text-center text-gray-400 py-6 text-xs">Belum ada jadwal.</p>';
  let modal='';
  if(S.editingJadwal){
    const ed=S.editingJadwal;
    let kelasOpts='';kelasList.forEach(function(k){kelasOpts+='<option value="'+esc(k)+'" '+(ed.kelas===k?'selected':'')+'>'+esc(k)+'</option>';});
    let hariOpts='';HARI.forEach(function(h){hariOpts+='<option value="'+h+'" '+(ed.hari===h?'selected':'')+'>'+h+'</option>';});
    modal='<div class="fixed inset-0 bg-black bg-opacity-50 flex items-end sm:items-center justify-center z-50 p-0 sm:p-4">'+
      '<form onsubmit="saveJadwal(event)" class="bg-white p-4 w-full max-w-md shadow-2xl slide-up sm:fade-in" style="border-radius:24px 24px 0 0;border-top:4px solid #06b6d4;">'+
      '<div class="handle mx-auto" style="width:40px;height:4px;background:#d1d5db;border-radius:2px;margin-bottom:12px;"></div>'+
      '<h3 class="font-bold text-base mb-3">'+(ed.id?'Edit':'Tambah')+' Jadwal</h3>'+
      '<div class="space-y-2">'+
      '<select onchange="S.editingJadwal.kelas=this.value" class="w-full bg-yellow-50 border-2 border-yellow-200 rounded-xl px-3 py-2 text-sm font-medium">'+kelasOpts+'</select>'+
      '<select onchange="S.editingJadwal.hari=this.value" class="w-full bg-yellow-50 border-2 border-yellow-200 rounded-xl px-3 py-2 text-sm font-medium">'+hariOpts+'</select>'+
      '<input type="text" required value="'+esc(ed.jam)+'" oninput="S.editingJadwal.jam=this.value" class="w-full bg-yellow-50 border-2 border-yellow-200 rounded-xl px-3 py-2 text-sm" placeholder="Jam" />'+
      '<input type="text" required value="'+esc(ed.mapel)+'" oninput="S.editingJadwal.mapel=this.value" class="w-full bg-yellow-50 border-2 border-yellow-200 rounded-xl px-3 py-2 text-sm" placeholder="Mapel" />'+
      '<input type="text" required value="'+esc(ed.guru)+'" oninput="S.editingJadwal.guru=this.value" class="w-full bg-yellow-50 border-2 border-yellow-200 rounded-xl px-3 py-2 text-sm" placeholder="Guru" />'+
      '<div class="flex gap-2 pt-1"><button type="button" data-action="close-jadwal-modal" class="btn-kid flex-1 bg-gray-200 py-2.5 rounded-xl text-sm">Batal</button>'+
      '<button type="submit" class="btn-kid flex-1 bg-cyan-500 text-white py-2.5 rounded-xl text-sm">Simpan</button></div>'+
      '</div></form></div>';
  }
  return '<div class="fade-in">'+
    '<div class="page-header">'+
    '<div class="icon-badge">📅</div>'+
    '<div class="flex-1"><h1>Jadwal</h1><div class="sub">'+list.length+' pelajaran</div></div>'+
    '<div class="flex gap-1 items-center">'+
    '<select onchange="S.jadwalKelas=this.value;loadJadwal().then(render);" class="bg-white border-2 border-gray-200 rounded-xl px-2 py-1.5 text-[11px] font-bold">'+filterOpts+'</select>'+
    (S.user.role==='admin'?'<button data-action="open-add-jadwal" class="bg-cyan-500 text-white px-2.5 py-1.5 rounded-xl text-[11px] font-bold">+</button>':'')+
    '</div></div>'+modal+'<div>'+content+'</div></div>';
}

// =================================================================
// VIEW: TERBAIK
// =================================================================
function viewAdminTerbaik(){return viewSantriTerbaik();}
function viewSantriTerbaik(){
  const sorted=filterByKelas(S.students).sort(function(a,b){return b.points-a.points;});
  const medals=['🥇','🥈','🥉'];
  const myId=S.user.role==='santri'?S.user.data.id:null;
  let myRank=0;
  if(myId)for(let i=0;i<sorted.length;i++){if(sorted[i].id===myId){myRank=i+1;break;}}
  let rows='';
  sorted.forEach(function(s,i){
    const rank=i<3?medals[i]:'<span class="text-gray-500 font-bold text-xs">#'+(i+1)+'</span>';
    const cls=s.points>=0?'text-green-600':'text-red-600';
    const isMe=s.id===myId;
    rows+='<div class="flex items-center justify-between py-2 border-b border-gray-100 last:border-0 '+(isMe?'bg-purple-50 -mx-2 px-2 rounded-lg':'')+'">'+
      '<div class="flex items-center gap-2 min-w-0"><span class="text-base w-6 flex-shrink-0">'+rank+'</span>'+
      '<div class="min-w-0"><div class="font-bold text-sm truncate">'+esc(s.name)+(isMe?' <span class="text-[9px] bg-purple-500 text-white px-1 rounded">KAMU</span>':'')+'</div>'+
      '<div class="text-[10px] text-gray-500">'+esc(s.kelas)+' · '+esc(s.badge)+'</div></div></div>'+
      '<span class="font-black '+cls+'">'+s.points+'</span></div>';
  });
  const myCard=myId&&myRank>3?'<div class="card-kid bg-gradient-to-r from-purple-500 to-indigo-500 p-4 text-white mb-3">'+
    '<div class="flex items-center justify-between">'+
    '<div><div class="text-[10px] opacity-90 font-bold">POSISI KAMU</div><div class="text-3xl font-black">#'+myRank+'</div></div>'+
    '<div class="text-right"><div class="text-[10px] opacity-90">Poin</div><div class="text-2xl font-black">'+(S.user.data.points||0)+'</div></div>'+
    '</div></div>':'';
  return '<div class="fade-in">'+
    '<div class="page-header">'+
    '<div class="icon-badge">🏆</div>'+
    '<div class="flex-1"><h1>Papan Peringkat</h1><div class="sub">'+sorted.length+' santri</div></div></div>'+
    myCard+
    '<div class="card-kid bg-white p-4">'+rows+'</div></div>';
}

function viewSantriGrafik(){

  }
  const maxVal=Math.max(10,Math.max.apply(null,S.santriGrafik.map(function(g){return Math.abs(g.total);})));
  const width=500,height=200,padding=40;
  const barWidth=(width-padding*2)/S.santriGrafik.length;
  let bars='';
  S.santriGrafik.forEach(function(g,i){
    const val=g.total;

    const color=val>=0?'#34d399':'#f87171';
    bars+='<rect x="'+x+'" y="'+y+'" width="'+(barWidth-20)+'" height="'+barH+'" fill="'+color+'" rx="4" />';
    bars+='<text x="'+(x+(barWidth-20)/2)+'" y="'+(val>=0?y-6:y+barH+14)+'" text-anchor="middle" font-size="11" font-weight="bold" fill="#374151">'+val+'</text>';
    bars+='<text x="'+(x+(barWidth-20)/2)+'" y="'+(height-8)+'" text-anchor="middle" font-size="9" fill="#6b7280">'+g.label+'</text>';
  });
  const totalSemua=S.santriGrafik.reduce(function(a,g){return a+g.total;},0);
  const bulanBest=S.santriGrafik.reduce(function(a,b){return(b.total>a.total)?b:a;},S.santriGrafik[0]);
  return '<div class="fade-in">'+
    '<div class="page-header">'+
    '<div class="icon-badge">📈</div>'+
    '<div class="flex-1"><h1>Grafik Poin</h1><div class="sub">6 bulan terakhir</div></div></div>'+
    '<div class="card-kid bg-white p-3 mb-3"><svg viewBox="0 0 '+width+' '+height+'" class="w-full">'+bars+'</svg></div>'+
    '<div class="grid grid-cols-2 gap-3">'+
    '<div class="card-kid bg-gradient-to-br from-yellow-50 to-amber-100 p-3 text-center">'+
    '<div class="text-2xl">📊</div><div class="text-[10px] text-gray-600 font-bold">TOTAL</div>'+
    '<div class="text-2xl font-black text-amber-700">'+totalSemua+'</div></div>'+
    '<div class="card-kid bg-gradient-to-br from-green-50 to-emerald-100 p-3 text-center">'+
    '<div class="text-2xl">🏆</div><div class="text-[10px] text-gray-600 font-bold">BULAN BEST</div>'+
    '<div class="text-xl font-black text-emerald-700">'+bulanBest.label+'</div></div></div></div>';
}

async function changePinSubmit(e){

  if(newPin!==confirmPin)return showToast('PIN baru tidak sama!','warn');

  if(!/^\d{4,6}$/.test(String(newPin)))return showToast('PIN hanya angka (4-6 digit)','warn');
  S.submitting=true;render();
  try{await api('changeSantriPin',oldPin,newPin);playDing();showToast('PIN berhasil diubah!','success');e.target.reset();}
  catch(err){showToast('Gagal: '+err.message,'error');}
  S.submitting=false;render();
}

// =================================================================
// DRAG & DROP UPLOAD
// =================================================================
document.addEventListener('dragover',function(e){const zone=e.target.closest&&e.target.closest('.upload-zone');if(zone){e.preventDefault();zone.classList.add('dragover');}});
document.addEventListener('dragleave',function(e){const zone=e.target.closest&&e.target.closest('.upload-zone');if(zone)zone.classList.remove('dragover');});
document.addEventListener('drop',function(e){
  const zone=e.target.closest&&e.target.closest('.upload-zone');
  if(!zone)return;
  e.preventDefault();zone.classList.remove('dragover');
  const input=zone.querySelector('input[type=file]');
  if(!input||input.disabled)return;
  const files=e.dataTransfer.files;
  if(files&&files.length){
    if(S.editingMateri)handleImageSelect({target:{files:files}});
    else if(S.editingReward)handleRewardImageSelect({target:{files:files}});
  }
});

// =================================================================
// GOTO dengan scroll reset saat ganti view
// =================================================================
async function goto(view){
  const viewChanged=S.view!==view;
  S.view=view;
  S.drawerOpen=false;
  S.poinSheetOpen=false;
  if(view==='riwayat')await loadRiwayat();
  else if(view==='rekap_kehadiran')await loadKehadiran();
  else if(view==='kehadiran_input'){await loadAbsenData();await loadPoinHariIni();}
  else if(view==='arsip')await loadArsipList();
  else if(view==='jadwal')await loadJadwal();
  else if(view==='users')await loadUsers();
  else if(view==='kuis'||view==='kuis_santri')await loadKuis();
  else if(view==='evaluasi')await loadEvaluasi();
  else if(view==='badge_saya')await loadSantriBadges();
  else if(view==='grafik')await loadGrafik();
  else if(view==='reward')await loadRedemptions();
  else if(view==='poin')await loadPoinHariIni();
  if(viewChanged){window.scrollTo(0,0);render({preserveScroll:false});}
  else render();
}
async function selectArsip(p){S.arsipSelected=p;try{S.arsipData=await api('getArsipPoin',p);}catch(err){showToast('Gagal: '+err.message,'error');}render();}

    try{
      S.user=JSON.parse(savedUser);
      if(S.user&&S.user.role==='santri'&&S.user.data&&S.user.data.mustChangePin)S.mustChangePin=true;
    }catch(e){}
  }
  if(!S.user||!token()){
    S.loading=false;
    render();
    return;
  }
  Promise.all([loadData(),loadJadwal()]).then(function(){
    if(S.user&&S.user.role==='santri')return Promise.all([loadSantriBadges(),loadGrafik()]);
  }).catch(function(){}).then(function(){S.loading=false;render();});
})();
</script>
</body>
</html>
