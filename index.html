<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TPQ Bani Saleh - Aplikasi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { margin: 0; font-family: 'Fredoka', system-ui, sans-serif; background: #fef9f3; }
  h1, h2, h3, .font-head { font-family: 'Baloo 2', 'Fredoka', sans-serif; font-weight: 700; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #fcd34d; border-radius: 8px; }
  ::-webkit-scrollbar-track { background: #fef3c7; }
  .hide-scroll::-webkit-scrollbar { display: none; }
  .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
  
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .fade-in { animation: fadeIn 0.3s ease-out; }
  
  .card-kid { border-radius: 20px; box-shadow: 0 4px 0 rgba(0,0,0,0.05), 0 8px 20px rgba(0,0,0,0.05); border: 3px solid #fff; transition: transform 0.15s; }
  .card-kid:hover { transform: translateY(-2px); }
  .btn-kid { border-radius: 16px; border-bottom: 4px solid rgba(0,0,0,0.15); transition: all 0.1s; font-weight: 700; }
  .btn-kid:active { transform: translateY(2px); border-bottom-width: 2px; }
  
  .status-btn { padding: 8px 4px; border-radius: 12px; font-weight: 700; font-size: 11px; cursor: pointer; border: 2px solid; transition: all 0.15s; text-align: center; }
  .status-hadir { background: #d1fae5; color: #065f46; border-color: #6ee7b7; }
  .status-hadir.active { background: #10b981; color: white; border-color: #059669; box-shadow: 0 2px 6px rgba(16,185,129,0.4); transform: scale(1.05); }
  .status-sakit { background: #fef3c7; color: #92400e; border-color: #fcd34d; }
  .status-sakit.active { background: #f59e0b; color: white; border-color: #d97706; box-shadow: 0 2px 6px rgba(245,158,11,0.4); transform: scale(1.05); }
  .status-izin { background: #dbeafe; color: #1e40af; border-color: #93c5fd; }
  .status-izin.active { background: #3b82f6; color: white; border-color: #2563eb; box-shadow: 0 2px 6px rgba(59,130,246,0.4); transform: scale(1.05); }
  .status-alfa { background: #fee2e2; color: #991b1b; border-color: #fca5a5; }
  .status-alfa.active { background: #ef4444; color: white; border-color: #dc2626; box-shadow: 0 2px 6px rgba(239,68,68,0.4); transform: scale(1.05); }

  .rule-check { border-radius: 12px; padding: 10px; border: 2px solid; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: all 0.15s; user-select: none; }
  .rule-pos { background: #f0fdf4; border-color: #bbf7d0; }
  .rule-pos.selected { background: #dcfce7; border-color: #10b981; box-shadow: 0 2px 6px rgba(16,185,129,0.2); }
  .rule-neg { background: #fef2f2; border-color: #fecaca; }
  .rule-neg.selected { background: #fee2e2; border-color: #ef4444; box-shadow: 0 2px 6px rgba(239,68,68,0.2); }
  .rule-checkbox { width: 18px; height: 18px; border-radius: 4px; border: 2px solid #cbd5e1; background: white; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .rule-pos.selected .rule-checkbox { background: #10b981; border-color: #10b981; }
  .rule-neg.selected .rule-checkbox { background: #ef4444; border-color: #ef4444; }
  .rule-checkbox-inner { color: white; font-size: 12px; font-weight: 900; }
</style>
</head>
<body>
<div id="app">
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#fef3c7,#fce7f3);">
    <div style="background:white;padding:40px;border-radius:24px;text-align:center;">
      <div class="text-5xl mb-4">📖</div>
      <h1 class="text-2xl font-bold text-amber-500">Memuat Aplikasi...</h1>
    </div>
  </div>
</div>

<script>
// =================================================================
// KONFIGURASI API (URL Web App Apps Script Anda)
// =================================================================
const API_URL = 'https://script.google.com/macros/s/AKfycbxSh_flmpcz2ADg0QEZ1lR7PFnt5DEsnoCzfku7eLzvZfwql31zD9Mtafw9rdG5ctyZ/exec';

// =================================================================
// STATE
// =================================================================
const S = {
  user: null, view: 'dashboard',
  students: [], rules: [], dashboard: null,
  loading: true, error: '',
  
  // Login state
  loginView: 'selection', loginUser: '', loginPass: '', loginStudent: '', loginError: '', isLoggingIn: false,
  
  // Absensi state
  absenTanggal: new Date().toISOString().slice(0, 10),
  absenData: {},
  
  // Poin state
  poinTab: 'aturan', selectedStudents: [], selectedRules: {}, customAmount: '', customNote: '',
  searchTerm: '',
  
  // Setoran state
  setoranData: { studentId: '', jenis: 'Iqra', detail: '', status: 'Lancar', catatan: '' },
  
  // Rapor state
  raporStudent: '', raporBulan: new Date().getMonth() + 1, raporTahun: new Date().getFullYear(),
  raporData: null,
  
  // Rekap state
  rekapBulan: new Date().getMonth() + 1, rekapTahun: new Date().getFullYear(), rekapData: [],
  
  // Riwayat state
  riwayatData: [],
  
  // Kelola Santri state
  editingSantri: null,
  
  // Pengaturan state
  newAturan: { name: '', points: 1 },
  
  submitting: false
};

const BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];

// =================================================================
// HELPERS
// =================================================================
function esc(s) { return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function showToast(msg, type = 'info') {
  const colors = { success: 'from-green-500 to-emerald-600', error: 'from-red-500 to-rose-600', info: 'from-blue-500 to-indigo-600', warn: 'from-amber-500 to-orange-600' };
  const el = document.createElement('div');
  el.className = `fixed bottom-4 right-4 z-[9999] px-5 py-3 rounded-xl text-white font-bold shadow-2xl bg-gradient-to-r ${colors[type]} fade-in`;
  el.style.maxWidth = '350px';
  el.innerHTML = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3500);
}
function token() { return sessionStorage.getItem('tpq_token') || ''; }
function setToken(t) { t ? sessionStorage.setItem('tpq_token', t) : sessionStorage.removeItem('tpq_token'); }
function saveUser(u) { u ? sessionStorage.setItem('tpq_user', JSON.stringify(u)) : sessionStorage.removeItem('tpq_user'); }

// =================================================================
// API WRAPPER
// =================================================================
async function api(fnName, ...args) {
  const payload = { fn: fnName, args: [token()].concat(args) };
  try {
    const res = await fetch(API_URL, {
      method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload), redirect: 'follow'
    });
    if (!res.ok) throw new Error('HTTP Error ' + res.status);
    const json = await res.json();
    if (!json.ok) {
      if (json.error.includes('Sesi habis') || json.error.includes('Login ulang')) {
        sessionStorage.clear(); S.user = null; render(); 
        throw new Error('Sesi habis, silakan login ulang.');
      }
      throw new Error(json.error);
    }
    return json.data;
  } catch (err) {
    throw new Error(err.message || String(err));
  }
}
async function apiLogin(fnName, ...args) {
  const payload = { fn: fnName, args: args };
  try {
    const res = await fetch(API_URL, {
      method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload), redirect: 'follow'
    });
    if (!res.ok) throw new Error('HTTP Error ' + res.status);
    const json = await res.json();
    if (!json.ok) throw new Error(json.error);
    return json.data;
  } catch (err) {
    throw new Error(err.message || String(err));
  }
}

// =================================================================
// LOADERS
// =================================================================
async function loadData() {
  try {
    const data = await api('getInitialData');
    S.students = data.students || [];
    S.rules = data.pointRules || [];
  } catch (err) { S.error = err.message; }
}
async function loadDashboard() {
  try { S.dashboard = await api('getDashboardData'); } catch (e) { S.dashboard = null; }
}
async function loadAbsensi() {
  try {
    const res = await api('getAttendanceByDate', S.absenTanggal);
    S.absenData = {};
    S.students.forEach(s => { S.absenData[s.id] = { status: 'Hadir', keterangan: '' }; });
    res.forEach(r => { S.absenData[r.studentId] = { status: r.status, keterangan: r.keterangan }; });
  } catch (e) { showToast(e.message, 'error'); }
}
async function loadRekap() {
  S.loading = true; render();
  try { S.rekapData = await api('getRekapKehadiran', S.rekapBulan, S.rekapTahun); } catch (e) { showToast(e.message, 'error'); }
  S.loading = false; render();
}
async function loadRiwayat() {
  S.loading = true; render();
  try { S.riwayatData = await api('getLogPoin', 100); } catch (e) { showToast(e.message, 'error'); }
  S.loading = false; render();
}
async function loadRapor() {
  if (!S.raporStudent) return showToast('Pilih santri dulu!', 'warn');
  S.loading = true; render();
  try { S.raporData = await api('getRaporSantri', S.raporStudent, S.raporBulan, S.raporTahun); } catch (e) { showToast(e.message, 'error'); }
  S.loading = false; render();
}

// =================================================================
// ACTIONS
// =================================================================
async function doLoginAdmin() {
  S.loginError = ''; S.isLoggingIn = true; render();
  try {
    const res = await apiLogin('loginAdmin', S.loginUser, S.loginPass);
    sessionStorage.clear(); setToken(res.token);
    S.user = { role: res.role, data: res.data }; saveUser(S.user);
    S.view = 'dashboard'; await loadData();
  } catch (err) { S.loginError = err.message; }
  S.isLoggingIn = false; render();
}
async function doLoginSantri() {
  S.loginError = ''; S.isLoggingIn = true; render();
  try {
    const res = await apiLogin('loginSantri', S.loginStudent, S.loginPass);
    sessionStorage.clear(); setToken(res.token);
    S.user = { role: res.role, data: res.data }; saveUser(S.user);
    S.view = 'dashboard'; await loadData();
  } catch (err) { S.loginError = err.message; }
  S.isLoggingIn = false; render();
}
async function doLogout() {
  try { await api('logoutUser'); } catch(e){}
  sessionStorage.clear(); S.user = null; S.view = 'dashboard'; S.loginView = 'selection'; render();
}

async function submitAbsen() {
  S.submitting = true; render();
  try {
    const records = Object.keys(S.absenData).map(id => ({
      studentId: parseInt(id),
      status: S.absenData[id].status,
      keterangan: S.absenData[id].keterangan || ''
    }));
    const res = await api('saveAttendance', { tanggal: S.absenTanggal, records });
    showToast(`✅ Kehadiran tersimpan (${res.jumlah} santri). Hadir dapat +${res.poinOtomatis} poin.`, 'success');
    await loadData(); // Refresh poin
  } catch (err) { showToast(err.message, 'error'); }
  S.submitting = false; render();
}

async function submitPoinMulti() {
  if (!S.selectedStudents.length) return showToast('Pilih minimal 1 santri!', 'warn');
  const ruleIds = Object.keys(S.selectedRules);
  if (!ruleIds.length) return showToast('Pilih minimal 1 aktivitas!', 'warn');
  S.submitting = true; render();
  try {
    const rulesList = ruleIds.map(id => ({ ruleId: parseInt(id), multiplier: S.selectedRules[id] || 1 }));
    const res = await api('savePointsMulti', S.selectedStudents, rulesList);
    showToast(`✅ ${res.updated} santri diperbarui (Total: ${res.totalPoints > 0 ? '+' : ''}${res.totalPoints} poin)`, 'success');
    S.selectedStudents = []; S.selectedRules = {}; await loadData();
  } catch (err) { showToast(err.message, 'error'); }
  S.submitting = false; render();
}

async function submitPoinCustom() {
  if (!S.selectedStudents.length) return showToast('Pilih minimal 1 santri!', 'warn');
  const amt = parseInt(S.customAmount, 10);
  if (isNaN(amt)) return showToast('Isi jumlah poin!', 'warn');
  S.submitting = true; render();
  try {
    const res = await api('saveCustomPoints', S.selectedStudents, amt, S.customNote);
    showToast(`✅ ${res.updated} santri diperbarui (${amt > 0 ? '+' : ''}${amt} poin)`, 'success');
    S.selectedStudents = []; S.customAmount = ''; S.customNote = ''; await loadData();
  } catch (err) { showToast(err.message, 'error'); }
  S.submitting = false; render();
}

async function submitSetoran(e) {
  e.preventDefault();
  if (!S.setoranData.studentId) return showToast('Pilih Santri!', 'warn');
  if (!S.setoranData.detail) return showToast('Isi detail setoran!', 'warn');
  S.submitting = true; render();
  try {
    await api('saveSetoran', S.setoranData);
    showToast('✅ Setoran berhasil disimpan!', 'success');
    S.setoranData = { studentId: '', jenis: 'Iqra', detail: '', status: 'Lancar', catatan: '' };
  } catch (err) { showToast(err.message, 'error'); }
  S.submitting = false; render();
}

async function submitAddSantri(e) {
  e.preventDefault();
  S.submitting = true; render();
  try {
    const payload = { name: S.editingSantri.name, kelas: S.editingSantri.kelas, pin: S.editingSantri.pin };
    if (S.editingSantri.id) {
      await api('updateSantri', S.editingSantri.id, payload);
      showToast('✅ Data santri diperbarui', 'success');
    } else {
      const res = await api('addSantri', payload);
      showToast(`✅ Santri ditambah. PIN: ${res.pin}`, 'success');
    }
    S.editingSantri = null; await loadData();
  } catch (err) { showToast(err.message, 'error'); }
  S.submitting = false; render();
}

async function submitAddAturan(e) {
  e.preventDefault();
  S.submitting = true; render();
  try {
    await api('addAturan', S.newAturan);
    showToast('✅ Aturan ditambah', 'success');
    S.newAturan = { name: '', points: 1 }; await loadData();
  } catch (err) { showToast(err.message, 'error'); }
  S.submitting = false; render();
}

async function shareRaporWA() {
  if (!S.raporData) return;
  try {
    const res = await api('generateRaporText', S.raporStudent, S.raporBulan, S.raporTahun);
    const url = 'https://wa.me/?text=' + encodeURIComponent(res.text);
    window.open(url, '_blank');
  } catch (err) { showToast(err.message, 'error'); }
}

// =================================================================
// RENDER COMPONENTS
// =================================================================
function render() {
  const app = document.getElementById('app');
  if (S.loading) {
    app.innerHTML = `<div class="min-h-screen flex items-center justify-center bg-yellow-50"><div class="text-center"><div class="text-5xl mb-4 animate-bounce">📖</div><p class="font-bold text-gray-500">Memuat...</p></div></div>`;
    return;
  }
  if (!S.user) { app.innerHTML = renderLogin(); return; }

  app.innerHTML = `
    <div class="min-h-screen p-3 pb-20" style="background:linear-gradient(180deg,#fef9f3 0%,#fef3c7 100%);">
      <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <div class="flex justify-between items-center mb-4 bg-white p-3 rounded-2xl shadow-sm border-2 border-yellow-100">
          <div class="flex items-center gap-2">
            <span class="text-2xl">📖</span>
            <div>
              <div class="font-bold text-gray-800 leading-tight">TPQ Bani Saleh</div>
              <div class="text-xs text-gray-500">${esc(S.user.data.name)} (${S.user.role})</div>
            </div>
          </div>
          <button onclick="doLogout()" class="text-xs font-bold text-red-500 bg-red-50 px-3 py-2 rounded-xl border border-red-100">Keluar</button>
        </div>
        
        <!-- Navigation (Scrollable) -->
        <div class="flex gap-2 overflow-x-auto pb-3 hide-scroll mb-2">
          ${renderNavBtn('dashboard', '🏠 Dashboard')}
          ${S.user.role === 'admin' ? `
            ${renderNavBtn('absensi', '⚡ Absensi')}
            ${renderNavBtn('poin', '🎯 Input Poin')}
            ${renderNavBtn('setoran', '📖 Setoran')}
            ${renderNavBtn('rapor', '📝 Rapor')}
            ${renderNavBtn('rekap', '📊 Rekap')}
            ${renderNavBtn('klasemen', '🏆 Klasemen')}
            ${renderNavBtn('riwayat', '📋 Riwayat')}
            ${renderNavBtn('santri', '👥 Santri')}
            ${renderNavBtn('pengaturan', '⚙️ Pengaturan')}
          ` : `
            ${renderNavBtn('rapor_santri', '📝 Raporku')}
          `}
        </div>

        <!-- Main Content -->
        <div class="fade-in">
          ${renderView()}
        </div>
      </div>
    </div>
  `;
}

function renderNavBtn(view, label) {
  const active = S.view === view;
  return `<button onclick="goto('${view}')" class="px-4 py-2 rounded-xl font-bold text-xs whitespace-nowrap transition-all ${active ? 'bg-amber-400 text-white shadow-md transform scale-105' : 'bg-white text-gray-600 shadow-sm'}">${label}</button>`;
}

function renderView() {
  switch (S.view) {
    case 'dashboard': return viewDashboard();
    case 'absensi': return viewAbsensi();
    case 'poin': return viewPoin();
    case 'setoran': return viewSetoran();
    case 'rapor': return viewRapor();
    case 'rapor_santri': return viewRapor(true);
    case 'rekap': return viewRekap();
    case 'klasemen': return viewKlasemen();
    case 'riwayat': return viewRiwayat();
    case 'santri': return viewSantri();
    case 'pengaturan': return viewPengaturan();
    default: return viewDashboard();
  }
}

// =================================================================
// VIEWS
// =================================================================
function renderLogin() {
  let content = '';
  if (S.loginError) content += `<div class="bg-red-100 text-red-700 p-3 rounded-xl mb-4 text-sm font-bold">${esc(S.loginError)}</div>`;
  
  if (S.loginView === 'selection') {
    content = `
      <div class="text-center mb-6">
        <h1 class="text-2xl font-bold text-amber-600">TPQ Bani Saleh</h1>
        <p class="text-gray-500 text-sm">Silakan pilih mode masuk</p>
      </div>
      <div class="space-y-3">
        <button onclick="S.loginView='admin';render();" class="w-full bg-blue-500 text-white font-bold py-4 rounded-2xl shadow-lg hover:bg-blue-600">👨‍🏫 Masuk Guru</button>
        <button onclick="S.loginView='santri';render();" class="w-full bg-green-500 text-white font-bold py-4 rounded-2xl shadow-lg hover:bg-green-600">⭐ Masuk Santri</button>
      </div>
    `;
  } else if (S.loginView === 'admin') {
    content = `
      <form onsubmit="event.preventDefault();doLoginAdmin();" class="space-y-4">
        <div class="text-center mb-4"><span class="bg-blue-100 text-blue-700 px-4 py-1 rounded-full font-bold text-sm">Mode Guru</span></div>
        <input type="text" value="${esc(S.loginUser)}" oninput="S.loginUser=this.value" placeholder="Username" required class="w-full bg-gray-50 border-2 border-gray-200 rounded-xl px-4 py-3" />
        <input type="password" value="${esc(S.loginPass)}" oninput="S.loginPass=this.value" placeholder="Password" required class="w-full bg-gray-50 border-2 border-gray-200 rounded-xl px-4 py-3" />
        <button type="submit" class="w-full bg-blue-500 text-white font-bold py-4 rounded-xl shadow-lg">Masuk</button>
        <button type="button" onclick="S.loginView='selection';render();" class="w-full text-gray-500 font-bold py-2">Kembali</button>
      </form>
    `;
  } else if (S.loginView === 'santri') {
    let opts = '<option value="">-- Pilih Namamu --</option>';
    S.students.forEach(s => { opts += `<option value="${s.id}">${esc(s.name)}</option>`; });
    content = `
      <form onsubmit="event.preventDefault();doLoginSantri();" class="space-y-4">
        <div class="text-center mb-4"><span class="bg-green-100 text-green-700 px-4 py-1 rounded-full font-bold text-sm">Mode Santri</span></div>
        <select required onchange="S.loginStudent=this.value" class="w-full bg-gray-50 border-2 border-gray-200 rounded-xl px-4 py-3">${opts}</select>
        <input type="password" value="${esc(S.loginPass)}" oninput="S.loginPass=this.value" placeholder="PIN Rahasia" required class="w-full bg-gray-50 border-2 border-gray-200 rounded-xl px-4 py-3 text-center tracking-widest" maxlength="6" />
        <button type="submit" class="w-full bg-green-500 text-white font-bold py-4 rounded-xl shadow-lg">Masuk</button>
        <button type="button" onclick="S.loginView='selection';render();" class="w-full text-gray-500 font-bold py-2">Kembali</button>
      </form>
    `;
  }
  return `<div class="min-h-screen flex items-center justify-center p-4"><div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-sm border-4 border-yellow-100 fade-in">${content}</div></div>`;
}

async function goto(view) {
  S.view = view;
  if (view === 'dashboard') await loadDashboard();
  if (view === 'absensi') await loadAbsensi();
  if (view === 'rekap') await loadRekap();
  if (view === 'riwayat') await loadRiwayat();
  if (view === 'rapor' || view === 'rapor_santri') { S.raporData = null; }
  render();
}

function viewDashboard() {
  if (!S.dashboard) { loadDashboard().then(render); return 'Memuat...'; }
  const d = S.dashboard;
  
  let top5Html = d.top5.map((s,i) => `
    <div class="flex items-center gap-3 bg-white p-2 rounded-xl mb-1 border border-gray-100">
      <div class="font-bold text-lg w-6 text-center">${i===0?'🥇':i===1?'🥈':i===2?'🥉':'#'+(i+1)}</div>
      <div class="flex-1 font-bold text-gray-700 text-sm truncate">${esc(s.name)}</div>
      <div class="font-black text-blue-600">${s.points}</div>
    </div>
  `).join('');

  let belumHtml = d.belumHadir.map(s => `<span class="inline-block bg-red-100 text-red-700 px-2 py-1 rounded-lg text-xs font-bold mr-1 mb-1">${esc(s.name)}</span>`).join('');
  if (!belumHtml) belumHtml = '<span class="text-green-600 text-sm font-bold">✅ Semua santri sudah absen hari ini!</span>';

  return `
    <div class="space-y-4">

function viewPoin() {
  const filtered = S.students.filter(s => s.name.toLowerCase().includes(S.searchTerm.toLowerCase()));
  const posRules = S.rules.filter(r => r.points >= 0);
  const negRules = S.rules.filter(r => r.points < 0);
  
  let ruleBox = (r) => {
    const isSel = S.selectedRules[r.id] !== undefined;
    return `
      <div onclick="if(S.selectedRules[${r.id}])delete S.selectedRules[${r.id}];else S.selectedRules[${r.id}]=1;render();" class="rule-check ${r.points>=0?'rule-pos':'rule-neg'} ${isSel?'selected':''}">
        <div class="rule-checkbox">${isSel?'<span class="rule-checkbox-inner">✓</span>':''}</div>
        <div class="flex-1 font-bold text-gray-700 text-sm truncate">${esc(r.name)}</div>
        <div class="font-black ${r.points>=0?'text-green-600':'text-red-600'}">${r.points>0?'+':''}${r.points}</div>
      </div>
    `;
  };

  let stuList = filtered.map(s => {
    const sel = S.selectedStudents.includes(s.id);
    return `
      <div onclick="if(S.selectedStudents.includes(${s.id}))S.selectedStudents=S.selectedStudents.filter(id=>id!==${s.id});else S.selectedStudents.push(${s.id});render();" class="flex items-center justify-between p-3 rounded-xl border-2 cursor-pointer ${sel?'bg-blue-50 border-blue-400':'bg-white border-gray-100'}">
        <div class="font-bold text-gray-800 text-sm truncate">${esc(s.name)}</div>
        <div class="text-sm font-black ${s.points<0?'text-red-500':'text-green-600'}">${s.points}</div>
      </div>
    `;
  }).join('');

  return `
    <div class="space-y-4">
      <div class="flex gap-2 bg-white p-1 rounded-xl shadow-sm">
        <button onclick="S.poinTab='aturan';render();" class="flex-1 py-2 rounded-lg font-bold text-sm ${S.poinTab==='aturan'?'bg-amber-100 text-amber-700':'text-gray-500'}">Aturan Cepat</button>
        <button onclick="S.poinTab='custom';render();" class="flex-1 py-2 rounded-lg font-bold text-sm ${S.poinTab==='custom'?'bg-amber-100 text-amber-700':'text-gray-500'}">Custom +/-</button>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- Kiri: Form -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 h-fit space-y-4">
          ${S.poinTab === 'aturan' ? `
            <div>
              <h4 class="font-bold text-green-700 text-sm mb-2">✅ Poin Reward</h4>
              <div class="space-y-1">${posRules.map(ruleBox).join('')}</div>
            </div>
            <div>
              <h4 class="font-bold text-red-700 text-sm mb-2">⚠ Poin Hukuman</h4>
              <div class="space-y-1">${negRules.map(ruleBox).join('')}</div>
            </div>
            <button onclick="submitPoinMulti()" ${S.submitting?'disabled':''} class="w-full bg-blue-500 text-white font-bold py-3 rounded-xl mt-2 disabled:opacity-50">Terapkan ke ${S.selectedStudents.length} Santri</button>
          ` : `
            <h4 class="font-bold text-gray-800 mb-2">Custom Poin</h4>
            <input type="number" value="${S.customAmount}" oninput="S.customAmount=this.value" placeholder="Contoh: 3 atau -2" class="w-full bg-gray-50 border-2 border-gray-200 rounded-xl px-4 py-3 font-bold text-lg mb-2" />
            <input type="text" value="${S.customNote}" oninput="S.customNote=this.value" placeholder="Keterangan (opsional)" class="w-full bg-gray-50 border-2 border-gray-200 rounded-xl px-4 py-3 mb-4" />
            <button onclick="submitPoinCustom()" ${S.submitting?'disabled':''} class="w-full bg-blue-500 text-white font-bold py-3 rounded-xl disabled:opacity-50">Terapkan ke ${S.selectedStudents.length} Santri</button>
          `}
        </div>

        <!-- Kanan: List Santri -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
          <div class="flex justify-between items-center mb-3">
            <h4 class="font-bold text-gray-800">Pilih Santri</h4>
            <input type="text" value="${S.searchTerm}" oninput="S.searchTerm=this.value;render();" placeholder="Cari..." class="bg-gray-50 border rounded-lg px-2 py-1 text-sm w-24" />
          </div>
          <div class="space-y-1 max-h-[50vh] overflow-y-auto pr-1">${stuList || 'Tidak ada santri'}</div>
        </div>
      </div>
    </div>
  `;
}

  studentList.forEach(s => { opts += `<option value="${s.id}" ${S.raporStudent==s.id?'selected':''}>${esc(s.name)} (${esc(s.kelas)})</option>`; });
  
  let bulanOpts = BULAN.map((b,i) => `<option value="${i+1}" ${S.raporBulan==i+1?'selected':''}>${b}</option>`).join('');

  let html = '';
  if (S.raporData) {
    const r = S.raporData;
    let setoranRows = r.setoranTerakhir.map(s => `

    html = `
      <div class="bg-white p-5 rounded-2xl shadow-sm border-2 border-amber-200 mt-4 fade-in" id="print-area">
        <div class="text-center border-b-2 border-dashed pb-4 mb-4">

          <p class="text-sm text-gray-500">TPQ Bani Saleh Cicadas</p>
          <p class="text-xs font-bold text-gray-600 mt-1">Periode: ${BULAN[r.periode.bulan-1]} ${r.periode.tahun}</p>
        </div>
        
        <div class="grid grid-cols-2 gap-2 mb-4 text-sm">
          <div class="text-gray-500">Nama Santri</div><div class="font-bold">: ${esc(r.student.name)}</div>
          <div class="text-gray-500">Kelas</div><div class="font-bold">: ${esc(r.student.kelas)}</div>
          <div class="text-gray-500">Peringkat</div><div class="font-bold text-amber-600">: #${r.rank} dari ${r.totalSantri}</div>
          <div class="text-gray-500">Poin Bulan Ini</div><div class="font-black text-blue-600 text-lg">: ${r.totalPoinBulan}</div>
        </div>

        <div class="grid grid-cols-4 gap-2 mb-6">
          <div class="bg-green-50 rounded-xl p-2 text-center border border-green-100"><div class="text-xl font-bold text-green-600">${r.hadir}</div><div class="text-[10px] text-green-800 font-bold">Hadir</div></div>
          <div class="bg-amber-50 rounded-xl p-2 text-center border border-amber-100"><div class="text-xl font-bold text-amber-600">${r.sakit}</div><div class="text-[10px] text-amber-800 font-bold">Sakit</div></div>
          <div class="bg-blue-50 rounded-xl p-2 text-center border border-blue-100"><div class="text-xl font-bold text-blue-600">${r.izin}</div><div class="text-[10px] text-blue-800 font-bold">Izin</div></div>
          <div class="bg-red-50 rounded-xl p-2 text-center border border-red-100"><div class="text-xl font-bold text-red-600">${r.alfa}</div><div class="text-[10px] text-red-800 font-bold">Alfa</div></div>
        </div>

        <h4 class="font-bold text-gray-800 mb-2 border-b pb-1">Setoran Terakhir</h4>
        <table class="w-full text-left mb-6">
          <thead><tr class="bg-gray-50 text-xs text-gray-500"><th class="p-2">Tanggal</th><th class="p-2">Jenis</th><th class="p-2">Detail</th><th class="p-2">Status</th></tr></thead>
          <tbody>${setoranRows}</tbody>
        </table>

        ${!isSantri ? `
        <div class="flex gap-2 no-print">
          <button onclick="window.print()" class="flex-1 bg-gray-200 text-gray-700 font-bold py-3 rounded-xl">🖨 Print</button>
          <button onclick="shareRaporWA()" class="flex-1 bg-green-500 text-white font-bold py-3 rounded-xl">📤 Share WA</button>
        </div>` : ''}
      </div>
    `;
  }

  return `
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 no-print">
      <h2 class="text-xl font-bold mb-4">📝 Cetak Rapor</h2>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-4">
        <div class="sm:col-span-1"><label class="text-xs font-bold text-gray-600">Santri</label><select onchange="S.raporStudent=this.value" class="w-full bg-gray-50 border rounded-xl px-3 py-2 mt-1">${opts}</select></div>

        <div><label class="text-xs font-bold text-gray-600">Tahun</label><input type="number" value="${S.raporTahun}" oninput="S.raporTahun=parseInt(this.value)" class="w-full bg-gray-50 border rounded-xl px-3 py-2 mt-1" /></div>
      </div>
      <button onclick="loadRapor()" ${S.loading?'disabled':''} class="w-full bg-blue-500 text-white font-bold py-3 rounded-xl shadow-md">🔍 Tampilkan Rapor</button>
    </div>
    ${html}
  `;
}

          <input type="text" required value="${esc(S.editingSantri.name)}" oninput="S.editingSantri.name=this.value" placeholder="Nama" class="w-full border-2 rounded-xl px-3 py-2 mb-2" />
          <input type="text" value="${esc(S.editingSantri.kelas)}" oninput="S.editingSantri.kelas=this.value" placeholder="Kelas" class="w-full border-2 rounded-xl px-3 py-2 mb-2" />
          <input type="text" value="${esc(S.editingSantri.pin)}" oninput="S.editingSantri.pin=this.value" placeholder="PIN (kosongkan untuk auto)" class="w-full border-2 rounded-xl px-3 py-2 mb-3" />
          <div class="flex gap-2">
            <button type="button" onclick="S.editingSantri=null;render();" class="flex-1 bg-gray-200 font-bold py-2 rounded-xl">Batal</button>
            <button type="submit" class="flex-1 bg-blue-500 text-white font-bold py-2 rounded-xl">Simpan</button>
          </div>
        </form>
      </div>
    `;
  }

  return `
    ${modal}
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-bold">👥 Data Santri</h2>
        <button onclick="S.editingSantri={name:'',kelas:'',pin:''};render();" class="bg-amber-400 text-white px-3 py-2 rounded-xl text-sm font-bold shadow-sm">+ Tambah</button>
      </div>
      <div class="max-h-[70vh] overflow-y-auto">${rows}</div>
    </div>
  `;
}

function viewPengaturan() {
  let rules = S.rules.map(r => `
    <div class="flex items-center justify-between p-2 border-b border-gray-100">
      <div class="font-bold text-sm text-gray-700">${esc(r.name)}</div>
      <div class="flex items-center gap-2">
        <span class="font-black ${r.points>0?'text-green-600':'text-red-600'}">${r.points>0?'+':''}${r.points}</span>
        <button onclick="if(confirm('Hapus?'))api('deleteAturan',${r.id}).then(loadData).then(render)" class="text-red-500 text-xs font-bold bg-red-50 px-2 py-1 rounded">X</button>
      </div>
    </div>
  `).join('');

  return `
    <div class="space-y-4">
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
        <h2 class="text-xl font-bold mb-4">⚙️ Atur Poin Aktivitas</h2>
        <form onsubmit="submitAddAturan(event)" class="flex gap-2 mb-4">
          <input type="text" required value="${esc(S.newAturan.name)}" oninput="S.newAturan.name=this.value" placeholder="Nama aktivitas" class="flex-1 border-2 rounded-xl px-3 py-2 text-sm" />
          <input type="number" required value="${S.newAturan.points}" oninput="S.newAturan.points=this.value" placeholder="Poin" class="w-20 border-2 rounded-xl px-3 py-2 text-sm" />
          <button type="submit" class="bg-blue-500 text-white px-3 rounded-xl font-bold text-sm">+</button>
        </form>
        <div class="max-h-[50vh] overflow-y-auto">${rules}</div>
      </div>
      
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
        <h3 class="font-bold text-gray-800 mb-2">Info Sistem</h3>
        <p class="text-xs text-gray-500">Sistem menggunakan Poin Otomatis: <b>Hadir = +2 Poin</b>.</p>
        <p class="text-xs text-gray-500 mt-1">Jika santri lupa PIN, buka Google Sheets -> tab SANTRI -> kolom PIN.</p>
      </div>
    </div>
  `;
}

// =================================================================
// BOOT
// =================================================================
(async function boot() {
  const savedUser = sessionStorage.getItem('tpq_user');
  if (savedUser && token()) { try { S.user = JSON.parse(savedUser); } catch(e){} }
  await loadData();
  S.loading = false;
  if (S.user && S.view === 'dashboard') await loadDashboard();
  render();
})();
</script>
</body>
</html>
